   across the lower half, held for several seconds. One silhouette per screen is
   the difference between a lit building and an inhabited one. */
const WIN_WARM = "#FFD98A", WIN_WARM_HOT = "#FFF0C4";
const WIN_COOL = "#B9DFF5", WIN_DARK = "#1E2742";

/* `key` must be built from the WORLD panel index, never from a screen x -- the
   whole layer re-rolls on every camera move otherwise, which is the strobe this
   background had before the ids were introduced. */
function drawWindow(wx, wy, w, h, key, bloom) {
  const base = rnd(key) > 0.45;
  const blinker = rnd(key * 7 + 3) > 0.82;
  const phase = Math.floor(clock / 3.5 + rnd(key * 11) * 9);
  let lit = blinker ? rnd(key * 3 + phase * 17) > 0.45 : base;
  if (!lit) { ctx.fillStyle = WIN_DARK; ctx.fillRect(wx, wy, w, h); return; }

  const tv = rnd(key * 29 + 5) > 0.86;
  let col = WIN_WARM, glow = "255,214,132", strength = 1;
  if (tv) {
    // A shallow, fast wobble. Deep enough to notice, not deep enough to read
    // as a bulb being switched -- that is what the slow blinkers are for.
    const f = 0.62 + 0.38 * Math.abs(Math.sin(clock * 7.3 + rnd(key * 3) * 6));
    col = WIN_COOL; glow = "150,205,240"; strength = f;
  } else if (rnd(key * 37 + 11) > 0.80) {
    col = WIN_WARM_HOT; glow = "255,238,190"; strength = 1.25;
  }

  if (bloom && quality >= Q_FULL) {
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(" + glow + "," + (0.050 * strength).toFixed(3) + ")";
    ctx.fillRect(wx - 3, wy - 3, w + 6, h + 6);
    ctx.fillStyle = "rgba(" + glow + "," + (0.085 * strength).toFixed(3) + ")";
    ctx.fillRect(wx - 1, wy - 1, w + 2, h + 2);
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.fillStyle = col;
  ctx.fillRect(wx, wy, w, h);

  // Somebody home. Held for ~4s blocks so it is a person standing there rather
  // than a pixel flickering.
  if (!tv && w >= 5 && h >= 6 && rnd(key * 53 + 17) > 0.89 &&
      Math.floor(clock / 4.1 + rnd(key * 13) * 5) % 3 === 0) {
    ctx.fillStyle = "rgba(40,30,22,0.72)";
    ctx.fillRect(wx + ((w - 2) >> 1), wy + Math.max(1, h >> 2), 2, h - (h >> 2) - 1);
  }
}

/* --- ATMOSPHERE ----------------------------------------------------------- */
/* Three cheap layers that do most of the work of making the alley feel like
   air rather than like flat cutouts at different distances. */

// Haze pooled at the base of a distance layer. Night does not lighten distance
// the way daylight haze does, but a city's own light does pool low -- and a
// few flat steps of it is what separates one silhouette band from the next.
function drawHazeBand(y, h, col) {
  const steps = 5;
  for (let i = 0; i < steps; i++) {
    const a = 0.17 * (1 - i / steps);
    ctx.fillStyle = "rgba(" + col + "," + a.toFixed(3) + ")";
    ctx.fillRect(0, y + Math.round((i / steps) * h), VIEW_W, Math.ceil(h / steps) + 1);
  }
}

/* Fog, on its OWN clock rather than on the camera. Every other layer here
   scrolls with cam.x at some divisor, so all of them stop dead when the player
   stops -- and a city that freezes the instant you stand still is the thing
   that made this background read as a painting. Fog that drifts on `clock`
   keeps moving when nothing else does, which is what sells the rest. */
function drawFog() {
  if (quality < Q_REDUCED) return;
  for (let band = 0; band < 2; band++) {
    const y = 138 + band * 26;
    const speed = 5 + band * 4;
    const off = Math.floor(clock * speed) % 260;
    const a = (0.075 + band * 0.03).toFixed(3);
    ctx.fillStyle = "rgba(150,160,186," + a + ")";
    for (let i = -1; i * 260 - off < VIEW_W + 260; i++) {
      const bx = i * 260 - off;
      // Three overlapping slabs of different widths per period: one slab per
      // period is a moving stripe, and a stripe reads as a seam.
      ctx.fillRect(bx, y, 150, 7 + band * 3);
      ctx.fillRect(bx + 96, y + 4, 104, 5 + band * 2);
      ctx.fillRect(bx + 40, y - 3, 70, 4);
    }
  }
}

/* Ash, or fine rain -- whichever the eye decides. Computed rather than
   allocated: sixty flecks whose positions are a pure function of `clock` and
   their own index, wrapped by modulo. No array, no spawn, no lifetime, and it
   cannot interact with the particle budget the hit effects live on.

   Two depths, because one is a curtain. The far layer is slower, dimmer and
   drifts less, and it is the difference between weather and a screen door. */
const ASH_COUNT = 60;
function drawAsh() {
  if (quality < Q_REDUCED) return;
  const count = quality >= Q_FULL ? ASH_COUNT : ASH_COUNT >> 1;
  for (let i = 0; i < count; i++) {
    const far = i % 3 === 0;
    const fall = far ? 26 : 44;
    const drift = far ? 9 : 16;
    const seed = rnd(i * 71 + 3);
    const x = ((seed * 900 + clock * drift) % (VIEW_W + 40)) - 20;
    const y = ((rnd(i * 37 + 9) * 460 + clock * fall) % (WALL_BOT + 40)) - 20;
    ctx.fillStyle = far ? "rgba(168,176,196,0.20)" : "rgba(198,206,224,0.34)";
    ctx.fillRect(Math.round(x), Math.round(y), 1, far ? 1 : 2);
  }
}

/* The moon is at a fixed point in SCREEN space (it is on the slowest layer
   there is, so it may as well be nailed down), which means the side of a
   building that faces it is knowable from x alone. One pixel of pale light down
   that edge is what stops the silhouettes reading as holes punched in the sky.
*/
const MOON_X = 529;
function moonRim(x, w, y, h, col) {
  ctx.fillStyle = col;
  const lit = (x + w / 2) < MOON_X ? x + w - 1 : x;
  ctx.fillRect(lit, y, 1, h);
}

// Fewer and wider than the first pass: a building every 40px read as static.
function drawSkyline() {                     // rate 1/16 -- furthest
  layerLoop(1 / 16, 240, (bx, id) => {
    for (let b = 0; b < 3; b++) {
      const w = 52 + Math.floor(rnd(id * 7 + b) * 34);
      const h = 44 + Math.floor(rnd(id * 13 + b) * 36);
      const x = bx + b * 80;
      const top = 126 - h;
      ctx.fillStyle = "#1E2640";
      ctx.fillRect(x, top, w, h);
      ctx.fillStyle = "#2A3350";          // roofline, catching the moon
      ctx.fillRect(x, top, w, 2);
      moonRim(x, w, top, h, "rgba(140,152,190,0.22)");
      /* ROOFTOP CLUTTER. Every building at this distance was a plain rectangle,
         and a row of plain rectangles is a bar chart. A tank, a mast or a vent
         box costs four rects and is the entire difference between a skyline and
         a histogram -- silhouette is all there is to read at this size. */
      const kit = Math.floor(rnd(id * 97 + b * 17) * 4);
      const kx = x + 6 + Math.floor(rnd(id * 41 + b) * Math.max(1, w - 24));
      if (kit === 0) {                       // water tank on legs
        ctx.fillStyle = "#1A2138";
        ctx.fillRect(kx, top - 9, 13, 7);
        ctx.fillRect(kx + 1, top - 2, 2, 2); ctx.fillRect(kx + 10, top - 2, 2, 2);
      } else if (kit === 1) {                // mast, with a lamp on top
        ctx.fillStyle = "#1A2138"; ctx.fillRect(kx + 3, top - 14, 1, 14);
        ctx.fillRect(kx, top - 6, 7, 1);
        // Aircraft warning light, slow and out of phase per building.
        if (Math.floor(clock * 1.3 + rnd(id * 7 + b) * 4) % 3 === 0) {
          ctx.fillStyle = "#FF6A5A"; ctx.fillRect(kx + 3, top - 15, 1, 1);
        }
      } else if (kit === 2) {                // stair head / vent box
        ctx.fillStyle = "#222A45"; ctx.fillRect(kx, top - 6, 16, 6);
        ctx.fillStyle = "#1A2138"; ctx.fillRect(kx, top - 7, 16, 1);
      }
      // A few far windows. Specks of warmth, with the same spill as the closer
      // ones at a third of the reach -- the bloom is what reads at this size,
      // the 2x3 rectangle underneath it barely does.
      for (let i = 0; i < 3; i++) {
        if (6 + i * 14 + 2 > w) break;
        const key = id * 53 + b * 9 + i;
        if (rnd(key) < 0.45) continue;
        const wx = x + 6 + i * 14, wy = top + 10 + (i % 2) * 12;
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(230,214,150,0.055)";
        ctx.fillRect(wx - 2, wy - 2, 6, 7);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#8C8468";
        ctx.fillRect(wx, wy, 2, 3);
      }
    }
  });
}

function drawMidBuildings() {                // rate 1/8
  layerLoop(1 / 8, 256, (bx, id) => {
    for (let b = 0; b < 2; b++) {
      const w = 66 + Math.floor(rnd(id * 5 + b) * 38);
      const h = 66 + Math.floor(rnd(id * 11 + b) * 54);
      const x = bx + b * 128;
      const top = 176 - h;
      ctx.fillStyle = "#283152";
      ctx.fillRect(x, top, w, h);
      ctx.fillStyle = "#1B223A";
      ctx.fillRect(x, top, w, 3);
      moonRim(x, w, top, h, "rgba(164,178,214,0.26)");
      /* A CORNICE every four storeys. Without it the window grid is the only
         horizontal information on an 80x120 slab, and the facade reads as
         graph paper. With it the building has floors. */
      for (let cy = top + 4 + 34; cy < 176; cy += 34) {
        ctx.fillStyle = "rgba(20,26,44,0.55)";
        ctx.fillRect(x, cy, w, 1);
      }
      // Rooftop kit, bigger than the skyline's because this layer is closer.
      const mk = Math.floor(rnd(id * 89 + b * 23) * 3);
      const mx = x + 8 + Math.floor(rnd(id * 47 + b) * Math.max(1, w - 30));
      if (mk === 0) {
        ctx.fillStyle = "#1F2742"; ctx.fillRect(mx, top - 12, 18, 10);
        ctx.fillStyle = "#171E34";
        ctx.fillRect(mx + 2, top - 2, 3, 2); ctx.fillRect(mx + 13, top - 2, 3, 2);
        ctx.fillRect(mx, top - 13, 18, 1);
      } else if (mk === 1) {
        ctx.fillStyle = "#1F2742";
        ctx.fillRect(mx + 5, top - 20, 2, 20);
        ctx.fillRect(mx + 1, top - 12, 10, 1);
        ctx.fillRect(mx + 2, top - 7, 8, 1);
        if (Math.floor(clock * 1.1 + rnd(id * 5 + b) * 5) % 3 === 0) {
          ctx.fillStyle = "#FF6A5A"; ctx.fillRect(mx + 5, top - 22, 2, 2);
        }
      }
      // Window seeds are keyed to (id, b, row, col) -- NEVER to the screen x.
      // Keying them to screen position re-rolled every window on every camera
      // move, which is why the lights appeared to strobe whenever you walked.
      let wi = 0;
      for (let wy = 176 - h + 11; wy < 170; wy += 17, wi++) {
        let wj = 0;
        for (let wx = x + 8; wx < x + w - 8; wx += 15, wj++) {
          // Seeded per (id, b, row, col) -- never from the screen x. The
          // classes, the slow blinkers, the television flicker, the spill and
          // the occupants all live in drawWindow().
          drawWindow(wx, wy, 5, 7, id * 977 + b * 71 + wi * 13 + wj, true);
        }
      }
    }
  });
}

/* SPRAY TAG.
   Two wrong answers before this one, and they failed in opposite directions.

   The first assembled rectangles into letter strokes: a vertical, a crossbar, a
   vertical -- a literal capital H -- and beside it a top bar with a downstroke
   off its left end, a literal Korean giyeok. The wall said "Hㄱ".

   The second avoided letters by bulging a stroke along a sine curve, which
   produces an OVAL, and an oval with drips hanging off it is a balloon. Five
   balloons per screen is what that looked like.

   What reads as spray paint and cannot be read as type is a STROKE PATH: a
   thick line through waypoints the seed picks, with the corners left sharp
   because that is what a can does when the wrist changes direction, and a dark
   outline two pixels fatter underneath so the tag sits on the brick instead of
   floating above it. The path is random, so there is no glyph to find; it is
   angular and connected, so it is not a blob.                               */
const TAG_INKS = [                           // [core, outline] as "r,g,b"
  ["214,74,58",   "54,14,10"],
  ["86,186,104",  "14,44,20"],
  ["222,190,70",  "56,44,10"],
  ["104,148,232", "12,22,56"],
  ["204,104,198", "46,14,44"]
];

function sprayTag(x, y, w, h, seed, core, edge) {
  const n = 5 + (rnd(seed + 9) > 0.5 ? 1 : 0);
  const px = [], py = [];
  for (let i = 0; i < n; i++) {
    // x marches across the band, with enough jitter that a segment can lean
    // back over the one before it. y ALTERNATES between the top and the bottom
    // of the band -- that is the whole trick. Sampling y freely produced
    // waypoints that happened to sit at nearly the same height, so the stroke
    // came out level, and a thick level stroke with two drips under it is a
    // park bench. Forcing the alternation makes it a zigzag by construction.
    px.push(x + Math.round((i / (n - 1)) * w +
                           (rnd(seed + i * 31) - 0.5) * w * 0.30));
    py.push(y + ((i % 2)
      ? Math.round(h * (0.70 + rnd(seed + i * 23) * 0.30))
      : Math.round(h * rnd(seed + i * 19) * 0.26)));
  }
  const thick = 5 + Math.floor(rnd(seed + 3) * 3);
  // Outline first, then the colour inside it, so the tag sits ON the brick
  // rather than floating over it. Square stamps every other pixel along each
  // segment: the path doubles back in x, so a column-per-x sweep cannot draw it.
  for (let pass = 0; pass < 2; pass++) {
    ctx.fillStyle = pass === 0 ? "rgb(" + edge + ")" : "rgb(" + core + ")";
    const t = thick + (pass === 0 ? 4 : 0), hf = t >> 1;
    for (let i = 0; i < n - 1; i++) {
      const dx = px[i + 1] - px[i], dy = py[i + 1] - py[i];
      const steps = Math.max(1, Math.max(Math.abs(dx), Math.abs(dy)) >> 1);
      for (let k = 0; k <= steps; k++) {
        ctx.fillRect(Math.round(px[i] + dx * k / steps) - hf,
                     Math.round(py[i] + dy * k / steps) - hf, t, t);
      }
    }
  }
  // One drip, from the lowest corner -- paint runs from where it pooled, and
  // two of them under a zigzag read as legs.
  let lo = 0;
  for (let i = 1; i < n; i++) if (py[i] > py[lo]) lo = i;
  ctx.fillStyle = "rgb(" + core + ")";
  const dl = 5 + Math.floor(rnd(seed * 5 + 7) * 9);
  const top = py[lo] + (thick >> 1) - 1;
  ctx.fillRect(px[lo] - 1, top, 2, dl);
  ctx.fillRect(px[lo] - 2, top + dl, 3, 2);            // the bead at the end
}

/* The alley wall's edges, in SCREEN space: it is a parallax layer and does not
   scroll vertically, so these are constants rather than world coordinates. They
   are up here rather than inside drawNearWall() because the wall is now
   something enemies come over, and a coping line that only the renderer knows
   about cannot be climbed. */
const WALL_TOP = 170, WALL_BOT = 330;

function drawNearWall() {                    // rate 1/4 -- the alley wall
  const TOP = WALL_TOP, BOT = WALL_BOT;
  layerLoop(1 / 4, 96, (bx, id) => {
    // Desaturated grey-brown: the wall is background, so it should not compete
    // with the playfield tiles in front of it.
    ctx.fillStyle = "#7A6A5E";
    ctx.fillRect(bx, TOP, 96, BOT - TOP);
    /* Brick, now at HALF-UNIT mortar. A one-unit joint is two device pixels
       wide at RENDER_SCALE 2, and two pixels of mortar around a 7x3 brick is a
       grid, not masonry -- it was the single biggest reason the largest surface
       on screen read as low resolution. A half-unit joint is one device pixel,
       which the 640x360 buffer could not draw at all.

       The freed contrast goes into a highlight on the top edge of each course
       and a shadow under it, so a brick has a top and a bottom. That is the
       detail: same geometry, three times the information per course. */
    const jw = 1 / RENDER_SCALE;
    for (let y = TOP, r = 0; y < BOT; y += 4, r++) {
      ctx.fillStyle = "#57504A";                     // the bed joint
      ctx.fillRect(bx, y, 96, jw);
      ctx.fillStyle = "rgba(190,178,166,0.16)";      // light catching the arris
      ctx.fillRect(bx, y + jw, 96, jw);
      ctx.fillStyle = "rgba(24,20,18,0.20)";         // shadow under the course
      ctx.fillRect(bx, y + 4 - jw, 96, jw);
      // Perpends, offset half a brick on alternate courses.
      ctx.fillStyle = "#57504A";
      for (let x = bx + (r % 2 ? 0 : 4); x < bx + 96; x += 8) {
        ctx.fillRect(x, y, jw, 4);
      }
    }
    /* MOONLIT COPING, then a fall-off down the face. The wall was one flat
       tone from the coping to the ground, which is the main reason it read as
       sixty per cent of the screen doing nothing: a surface with no light on it
       has no form. The light comes from the sky, so the top is the lit part and
       the bottom of the alley is where it runs out -- four flat steps, because
       a gradient bands under nearest-neighbour upscaling and the bands crawl.
       Flat steps stay put. */
    ctx.fillStyle = "#8C8076";
    ctx.fillRect(bx, TOP, 96, 3);
    ctx.fillStyle = "#A2958A";                 // the lit edge itself
    ctx.fillRect(bx, TOP, 96, 1);
    const FALL = 4, span = BOT - TOP;
    for (let i = 1; i <= FALL; i++) {
      ctx.fillStyle = "rgba(10,10,18," + (0.055 * i).toFixed(3) + ")";
      ctx.fillRect(bx, TOP + Math.round(span * (0.35 + 0.65 * (i - 1) / FALL)),
                   96, Math.ceil(span * 0.65 / FALL) + 1);
    }

    // Four dressings chosen by a hash of the panel index, so the wall does not
    // read as one motif repeating every 192px.
    switch (Math.floor(rnd(id * 3 + 1) * 4)) {
      case 0: {                              // fire escape
        const fx = bx + 18;
        ctx.fillStyle = "#332D28";
        ctx.fillRect(fx, TOP + 18, 2, BOT - TOP - 40);
        ctx.fillRect(fx + 40, TOP + 18, 2, BOT - TOP - 40);
        for (let y = TOP + 34; y < BOT - 26; y += 34) {
          ctx.fillRect(fx, y, 42, 2);
          for (let sx = fx + 2; sx < fx + 42; sx += 3) ctx.fillRect(sx, y + 2, 1, 4);
          for (let i = 0; i < 8; i++) ctx.fillRect(fx + 30 + i * 1.5, y + 6 + i * 3, 4, 1);
        }
        break;
      }
      case 1: {                              // neon sign, slow flicker
        const nx = bx + 26, ny = TOP + 40;
        const hue = rnd(id * 11) > 0.5;
        const on = Math.floor(clock + rnd(id) * 4) % 5 !== 4;
        const core = hue ? (on ? "#FF8ACB" : "#6B4358") : (on ? "#6BE3FF" : "#3E5C66");
        const litc = hue ? (on ? "#FFD3EC" : "#7E5266") : (on ? "#CFF6FF" : "#4E6E78");
        /* The sign had a flat tinted rectangle behind it standing in for a
           glow, which is a lit box, not a light. Additive rings instead: they
           ADD to the brick they sit on, so the wall itself brightens and the
           spill fades into it. Same reason the windows changed. */
        const nglow = hue ? "255,120,190" : "110,220,255";
        ctx.globalCompositeOperation = "lighter";
        for (let g = quality >= Q_FULL ? 0 : 2; g < 3; g++) {
          const pad = 16 - g * 6;
          ctx.fillStyle = "rgba(" + nglow + "," +
                          ((on ? 0.055 : 0.014) * (g + 1)).toFixed(3) + ")";
          ctx.fillRect(nx - pad, ny - pad, 36 + pad * 2, 24 + pad * 2);
        }
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#2A1420"; ctx.fillRect(nx - 2, ny - 2, 40, 28);
        ctx.fillStyle = core; ctx.fillRect(nx, ny, 36, 24);
        ctx.fillStyle = litc;
        ctx.fillRect(nx + 4, ny + 4, 28, 3);
        ctx.fillRect(nx + 4, ny + 11, 18, 3);
        ctx.fillRect(nx + 4, ny + 18, 24, 3);
        break;
      }
      case 2: {                              // boarded window + graffiti tag
        const wx = bx + 20, wy = TOP + 34;
        ctx.fillStyle = "#3A2C22"; ctx.fillRect(wx, wy, 40, 34);
        ctx.fillStyle = "#6B5138";
        for (let i = 0; i < 4; i++) ctx.fillRect(wx - 3, wy + 4 + i * 9, 46, 5);
        ctx.fillStyle = "#4A3728"; ctx.fillRect(wx - 3, wy + 13, 46, 3);
        // The tag that used to be bolted on here is now drawn for every panel
        // below, by sprayTag(), so this dressing is just the boarded window.
        break;
      }
      default: {                             // downpipe + service door
        ctx.fillStyle = "#4A4038";
        ctx.fillRect(bx + 12, TOP + 6, 4, BOT - TOP - 6);
        for (let y = TOP + 22; y < BOT; y += 46) ctx.fillRect(bx + 10, y, 8, 4);
        const dx = bx + 46, dh = 54;
        ctx.fillStyle = "#2E241C"; ctx.fillRect(dx, BOT - dh, 30, dh);
        ctx.fillStyle = "#5A4636"; ctx.fillRect(dx + 2, BOT - dh + 2, 26, dh - 2);
        ctx.fillStyle = "#3A2C20"; ctx.fillRect(dx + 4, BOT - dh + 5, 22, 2);
        ctx.fillStyle = "#C9A24A"; ctx.fillRect(dx + 23, BOT - dh + 26, 3, 3);
        break;
      }
    }

    /* PAPER LANTERNS. The alley had exactly two light sources on it -- the
       moon and a neon sign every fourth panel -- and neither is warm or low.
       A lantern hung at head height puts a warm pool on the brick right where
       the player is, which is both the thing that makes the wall read as an
       inhabited alley and the thing that makes the ninja's blue gi sit against
       something other than grey.

       One panel in three, and the flame breathes: two sine terms at
       incommensurable rates so it never settles into a visible loop. */
    if (rnd(id * 17 + 7) > 0.66) {
      const lx = bx + 10 + Math.floor(rnd(id * 23) * 60);
      const ly = TOP + 22 + Math.floor(rnd(id * 31) * 20);
      const breathe = 0.80 + 0.20 * Math.sin(clock * 3.1 + rnd(id * 5) * 6)
                           * Math.sin(clock * 1.7 + rnd(id * 9) * 6);
      ctx.globalCompositeOperation = "lighter";
      for (let g = quality >= Q_FULL ? 0 : 2; g < 3; g++) {
        const r = 26 - g * 8;
        ctx.fillStyle = "rgba(255,168,96," + (0.045 * (g + 1) * breathe).toFixed(3) + ")";
        ctx.fillRect(lx - r + 4, ly - r + 6, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#2A211A";                       // the cord
      ctx.fillRect(lx + 4, TOP + 3, 1, ly - TOP - 3);
      ctx.fillStyle = "#A8321E"; ctx.fillRect(lx, ly, 10, 12);     // paper
      ctx.fillStyle = "#C94A2A"; ctx.fillRect(lx + 1, ly + 1, 8, 10);
      ctx.fillStyle = "#FFCE7A"; ctx.fillRect(lx + 3, ly + 4, 4, 5); // the flame
      ctx.fillStyle = "#2A211A";
      ctx.fillRect(lx, ly - 1, 10, 1); ctx.fillRect(lx, ly + 12, 10, 1);
    }

    /* STEAM from a vent at the foot of the wall. Drifts on `clock` and not on
       the camera, for the same reason the fog does: it has to keep moving when
       the player stops. Drawn additively so it picks up whatever light is
       nearby rather than sitting on the brick as grey paint. */
    if (rnd(id * 41 + 13) > 0.72) {
      const vx = bx + 30 + Math.floor(rnd(id * 19) * 40);
      ctx.fillStyle = "#3A3128";
      ctx.fillRect(vx, BOT - 26, 16, 10);
      ctx.fillStyle = "#26201A";
      for (let i = 0; i < 4; i++) ctx.fillRect(vx + 2 + i * 4, BOT - 24, 2, 6);
      ctx.globalCompositeOperation = "lighter";
      for (let p = 0; p < 4; p++) {
        // Each puff rises on its own phase, widening and fading as it goes.
        const u = ((clock * 0.42 + p * 0.25 + rnd(id * 7 + p)) % 1);
        const py = BOT - 26 - u * 46;
        const pw = 5 + Math.round(u * 13);
        ctx.fillStyle = "rgba(186,196,214," + (0.085 * (1 - u)).toFixed(3) + ")";
        ctx.fillRect(vx + 8 - (pw >> 1) + Math.round(Math.sin(u * 4 + p) * 4),
                     Math.round(py), pw, 4 + Math.round(u * 4));
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // Tagged on EVERY panel, and two on some of them. Before this the graffiti
    // was one of four dressings, so a given tag appeared once every ~384px of
    // wall and the alley read as clean brick with a decal on it. Painted over
    // whatever dressing the panel drew, because that is the order it happens in.
    // One tag on roughly one panel in eight. The wall repeats every 96px, so
    // about seven panels are on screen at once: at three in four that was five
    // tags per screen and it read as wallpaper, and the same handful of seeds
    // recurring every few panels made it read as a repeat on top of that. At
    // one in eight there is usually nought or one in view, which is what makes
    // it something somebody did rather than a pattern.
    if (rnd(id * 29 + 5) > 0.88) {
      const sd = id * 197;
      // Taller than it is wide-ish. A band 50x15 cannot zigzag -- there is no
      // room to go up and down in -- so the aspect is part of the shape.
      const tw = 30 + Math.floor(rnd(sd) * 16);
      const th = 20 + Math.floor(rnd(sd + 1) * 12);
      const gx = bx + 4 + Math.floor(rnd(sd + 2) * Math.max(1, 96 - tw - 8));
      // Head height and below, where a tag actually goes, and clear of both
      // the roofline and the ground tiles that cover the bottom of the wall.
      const gy = TOP + 88 + Math.floor(rnd(sd + 3) * (BOT - TOP - 104 - th));
      const ink = TAG_INKS[Math.floor(rnd(sd + 4) * TAG_INKS.length)];
      sprayTag(gx, gy, tw, th, sd, ink[0], ink[1]);
    }
  });
}

function drawTiles() {
  const c0 = Math.max(0, Math.floor(cam.x / TILE));
  const c1 = Math.min(COLS - 1, Math.floor((cam.x + VIEW_W) / TILE));
  for (let r = 0; r < ROWS; r++) {
    for (let c = c0; c <= c1; c++) {
      if (!solidAt(c, r)) continue;
      const sx = Math.round(c * TILE - cam.x), sy = Math.round(r * TILE - cam.y);
      ctx.fillStyle = "#8E7360"; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#6B5648";
      ctx.fillRect(sx, sy + 7, TILE, 1);
      ctx.fillRect(sx + ((r % 2) ? 4 : 12), sy, 1, 7);
      ctx.fillRect(sx + ((r % 2) ? 12 : 4), sy + 8, 1, 8);
      if (!solidAt(c, r - 1)) { ctx.fillStyle = "#AE9384"; ctx.fillRect(sx, sy, TILE, 2); }
    }
  }
}

// A torii at the end of the alley: the player needs to SEE where the stage
// finishes, not discover it by walking into an invisible trigger.
function drawGoal() {
  const gx = Math.round(GOAL_TILE * TILE - cam.x);
  if (gx > VIEW_W + 90 || gx < -100) return;
  const gy = Math.round(20 * TILE - cam.y);
  ctx.fillStyle = "#6E2019";
  ctx.fillRect(gx + 5, gy - 90, 8, 90);
  ctx.fillRect(gx + 59, gy - 90, 8, 90);
  ctx.fillStyle = "#B2392C";
  ctx.fillRect(gx - 6, gy - 100, 84, 9);
  ctx.fillRect(gx + 2, gy - 88, 68, 6);
  ctx.fillStyle = "#8E2B22";
  ctx.fillRect(gx - 6, gy - 100, 84, 2);
  ctx.fillStyle = "#2A1F16";
  ctx.fillRect(gx + 26, gy - 82, 22, 14);
  ctx.fillStyle = "#FFD24A";
  ctx.fillRect(gx + 29, gy - 79, 16, 3);
  ctx.fillRect(gx + 29, gy - 74, 16, 3);
  drawTextHD("GOAL", gx + 18, gy - 118, "#FFE45E", 3);
}

function drawProps() {                       // foreground clutter, world space
  const t0 = Math.floor(cam.x / TILE), t1 = Math.floor((cam.x + VIEW_W) / TILE);
  for (let c = t0 - 2; c <= t1 + 2; c++) {
    if (c < 0 || c % 23 !== 7 || !solidAt(c, 20) || solidAt(c, 19)) continue;
    const sx = Math.round(c * TILE - cam.x), sy = Math.round(20 * TILE - cam.y);
    ctx.fillStyle = "#2F4A3E"; ctx.fillRect(sx, sy - 14, 26, 14);
    ctx.fillStyle = "#3E6152"; ctx.fillRect(sx, sy - 14, 26, 3);
    ctx.fillStyle = "#24382F"; ctx.fillRect(sx + 2, sy - 11, 22, 2);
    ctx.fillStyle = "#1A1410";
    ctx.fillRect(sx + 3, sy - 2, 3, 2); ctx.fillRect(sx + 20, sy - 2, 3, 2);
  }
}

function drawShurikenIcon(sx, sy, size, spin) {
  const h = size / 2, q = Math.max(1, Math.floor(size / 5));
  ctx.fillStyle = "#E9EDF2";
  if (spin) {
    ctx.fillRect(sx, sy + h - q / 2, size, q);
    ctx.fillRect(sx + h - q / 2, sy, q, size);
  } else {
    for (let i = 0; i < size; i += 2) {
      ctx.fillRect(sx + i, sy + i, 2, 2);
      ctx.fillRect(sx + size - 2 - i, sy + i, 2, 2);
    }
  }
  ctx.fillStyle = "#6E7A86";
  ctx.fillRect(sx + h - 1, sy + h - 1, 2, 2);
}

/* --- ENEMY WEAPON MOTION -------------------------------------------------- */
/* Every enemy attack already had a hitbox, a pose and a yellow tick over the
   head. None of that is a swing. The box is invisible, the pose is a single
   frame that does not move, and the tick says "something is coming" without
   saying WHAT or WHERE -- so getting hit read as having walked into a body,
   which is exactly the complaint.

   These are the same travelling half-annulus sweeps the player's blade uses,
   with one rule: the geometry is derived from the SAME constants as the hazard
   box, so the picture cannot drift away from the thing that actually kills you.
   A windup raises the steel and paints a dim preview of the ground the box will
   cover; the swing then sweeps that exact ground bright.

   The player's own arc is left alone deliberately. It is tuned to a 46px box on
   a 32px sprite and commented to match; sharing one function would have meant
   re-tuning it to serve four callers. */

// One travelling band along an ellipse. `p` is sweep progress 0..1, `span` the
// angle covered, `start` where it begins. dir mirrors it for a left-facing body.
function sweepArc(cx, cy, dir, p, rx, ry, thick, start, span, cols, alpha) {
  const steps = Math.max(18, Math.round(span * Math.max(rx, ry)));
  const leadTh = start + p * span;
  for (let i = 0; i <= steps; i++) {
    const th = start + (i / steps) * span;
    if (th > leadTh) break;                   // not swept through yet
    const behind = span > 0 ? (leadTh - th) / span : 0;
    const t2 = Math.max(2, thick * (1 - behind * 0.5));
    const mr = 1 - (t2 / 2) / rx, my = 1 - (t2 / 2) / ry;
    const px = cx + dir * rx * mr * Math.cos(th);
    const py = cy + ry * my * Math.sin(th);
    // Capped: an uncapped leading cell grows with `thick` and lands as one
    // fat square pasted on the end of the arc, which reads as a blob rather
    // than as a tip.
    const sz = Math.max(2, Math.min(7, Math.round(t2)));
    ctx.fillStyle = behind < 0.09 ? cols[0] : behind < 0.32 ? cols[1] : cols[2];
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillRect(Math.round(px - sz / 2), Math.round(py - sz / 2), sz, sz);
  }
  ctx.globalAlpha = 1;
}

/* A straight thrust: the point, then a trail tapering back to the hand. Drawn
   from the HAND outward rather than from the sprite's edge -- started at the
   edge it left a gap the width of the shoulder and read as a detached object
   floating beside the body. */
function thrustStreak(x, y, dir, len, thick, cols) {
  for (let i = 0; i < len; i += 2) {
    const k = 1 - i / len;                    // 1 at the point, 0 at the hand
    const t2 = Math.max(1, Math.round(thick * (0.35 + k * 0.65)));
    ctx.fillStyle = k > 0.82 ? cols[0] : k > 0.5 ? cols[1] : cols[2];
    ctx.fillRect(Math.round(x + dir * i - (dir < 0 ? 2 : 0)),
                 Math.round(y - t2 / 2), 2, t2);
  }
  // The point itself, one bright cell wider than the shaft.
  ctx.fillStyle = cols[0];
  ctx.fillRect(Math.round(x + dir * len - (dir < 0 ? 3 : 0)), Math.round(y - 2), 3, 4);
}

/* THE TELEGRAPH IS THE BOX, NOT THE ARC.
   The first version previewed the swing by drawing its whole 180-degree band at
   low alpha. A thin band over a full half-turn closes visually into a ring, and
   what it read as was a lasso being spun -- not "this ground is about to be
   lethal". So the preview is now the hazard rectangle itself: corner ticks and
   a faint fill, brightening as the windup runs out. It is the literal footprint
   of the box the enemy is about to push, which is the one thing worth knowing.

   `w` is windup progress 0..1, so the player reads urgency off the brightness
   and the position off the rectangle. */
function hazardPreview(x, y, w, h, prog, col, dir) {
  /* A WIPE, not a grid.
     Three versions of this. The first previewed the swing's whole arc at low
     alpha, and a thin band over a half-turn closes visually into a ring -- it
     read as a lasso being spun. The second hatched the box with scan lines
     every four pixels, which kept the alley visible but put a literal grid on
     the screen, and a grid is the one thing in a hand-painted alley that
     announces itself as an overlay.

     This is the same information with no pattern in it at all: the box FILLS
     from the attacker outward as the windup runs out, behind a soft leading
     edge. It is smooth, it has no repeating element to notice, and it says
     something the other two did not -- WHEN, not just where, because the filled
     fraction is the fraction of the windup that has elapsed.

     Edges are half a unit (one device pixel), which is only drawable at all
     because the buffer is 2x. */
  const hair = 1 / RENDER_SCALE;
  const x0 = Math.round(x * RENDER_SCALE) / RENDER_SCALE;
  const y0 = Math.round(y * RENDER_SCALE) / RENDER_SCALE;
  const fw = Math.max(hair, w * Math.min(1, prog));
  // Right-facing attacks fill left-to-right; a left-facing one fills from its
  // own body outward, which is the other edge.
  const fx = (dir === undefined || dir > 0) ? x0 : x0 + w - fw;

  ctx.fillStyle = "rgba(" + col + ",0.10)";
  ctx.fillRect(fx, y0, fw, h);
  ctx.fillStyle = "rgba(" + col + ",0.07)";
  ctx.fillRect(fx, y0 + h * 0.34, fw, h * 0.32);      // a little body, no lines

  // The leading edge: two soft steps, brightening as the attack nears.
  const lead = (dir === undefined || dir > 0) ? fx + fw : fx;
  ctx.fillStyle = "rgba(" + col + "," + (0.30 + prog * 0.45).toFixed(3) + ")";
  ctx.fillRect(lead - hair, y0, hair * 2, h);
  ctx.fillStyle = "rgba(" + col + "," + (0.12 + prog * 0.18).toFixed(3) + ")";
  ctx.fillRect(lead - hair * 4, y0, hair * 3, h);

  // A hairline outline so the extent is readable before the wipe reaches it.
  ctx.fillStyle = "rgba(" + col + "," + (0.10 + prog * 0.16).toFixed(3) + ")";
  ctx.fillRect(x0, y0, w, hair);
  ctx.fillRect(x0, y0 + h - hair, w, hair);
}

const CHG_STEEL = ["#FFF4D8", "#FFD489", "rgba(226,150,74,0.60)"];
const WARD_STEEL = ["#EAFBFF", "#9FE4F0", "rgba(120,196,214,0.58)"];
const RUSH_STEEL = ["#FFFFFF", "#E7C8FF", "rgba(178,132,226,0.60)"];

/* The raised weapon of a windup. Drawn as a short bar leaving the shoulder at
   the angle the sweep will START from, so the telegraph and the swing are
   visibly the same motion held still. It also GROWS over the windup, which is
   the part that reads as "being wound up" rather than "holding a pose". */
function windupSteel(cx, cy, dir, w, rx, ry, start, cols) {
  /* Pivoted at the HAND, not at the body's centre line, and cocked BACK over
     the shoulder rather than standing straight up. Both corrections come from
     the same mistake: drawn from the centre at the sweep's start angle, the bar
     was a couple of pixels of steel buried inside the torso -- present in the
     draw call and invisible on screen.

     It also lengthens over the windup, so the blade is still being raised while
     the bar over the head is still filling. */
  const hx = cx + dir * 5;
  const len = Math.round(13 + w * 15);
  const ang = start - dir * 0.42 * dir;      // tipped away from the swing
  const cs = Math.cos(ang), sn = Math.sin(ang) * (ry / rx);
  for (let i = 3; i < len; i += 2) {
    const k = i / len;
    ctx.fillStyle = k > 0.68 ? cols[0] : cols[1];
    ctx.fillRect(Math.round(hx - dir * cs * i * 0.55), Math.round(cy + sn * i), 3, 3);
  }
  // The tip catches the light, which is what makes it read as a raised edge.
  ctx.fillStyle = cols[0];
  ctx.fillRect(Math.round(hx - dir * cs * len * 0.55) - 1,
               Math.round(cy + sn * len) - 1, 4, 4);
}

/* WHERE A DIVE LANDS.
   Three wrong answers were tried before this one. groundTopRow() scans from the
   top and returns the ledge the sentry is standing on. Scanning down from the
   feet returns the same ledge, because the feet sit on its top row -- which
   made the drop shaft 8px tall and put the landing pad under the sentry's own
   boots, i.e. exactly where it already was.

   The column matters too. A dive pushes off sideways (PERCH_DIVE_VX), so it
   comes down BESIDE the structure, not through it -- the column to check is the
   one it drifts into.

   The fourth wrong answer was skipping solid rows before searching, to stop a
   wide platform reporting its own surface as the floor. On a 2-tile cover block
   whose neighbouring column is ALSO covered, that skipped the block, the alley
   floor beneath it and the row under that, ran off the bottom of the grid and
   returned "no floor" -- which drew a drop shaft from the roof to the bottom of
   the screen and a landing pad off the edge of the world.

   The honest rule is the plain one: the first solid row at or below the feet in
   the drift column. If that IS the feet row, the structure continues and the
   drop is zero-height, which the caller draws as a pad and no shaft. Over a pit
   the alley floor line is the best guess available. */
function diveTargetOf(e) {
  const cx = e.x + e.w / 2 + (e.diveDir || -1) * 16;
  const tx = Math.max(0, Math.min(COLS - 1, Math.floor(cx / TILE)));
  const feetRow = Math.floor((e.y + e.h) / TILE);
  for (let r = feetRow; r < ROWS; r++) if (solidAt(tx, r)) return { cx: cx, row: r };
  return { cx: cx, row: ROWS - 2 };
}

/* The same wipe, falling instead of sweeping. Worth the duplication: rotating
   the horizontal one through a transform would put the hairlines off the device
   grid, and a hairline that lands between pixels is a grey smear. */
function hazardPreviewV(x, y, w, h, prog, col) {
  const hair = 1 / RENDER_SCALE;
  const x0 = Math.round(x * RENDER_SCALE) / RENDER_SCALE;
  const y0 = Math.round(y * RENDER_SCALE) / RENDER_SCALE;
  const fh = Math.max(hair, h * Math.min(1, prog));
  ctx.fillStyle = "rgba(" + col + ",0.10)";
  ctx.fillRect(x0, y0, w, fh);
  ctx.fillStyle = "rgba(" + col + "," + (0.30 + prog * 0.45).toFixed(3) + ")";
  ctx.fillRect(x0, y0 + fh - hair, w, hair * 2);
  ctx.fillStyle = "rgba(" + col + "," + (0.12 + prog * 0.18).toFixed(3) + ")";
  ctx.fillRect(x0, y0 + fh - hair * 4, w, hair * 3);
  ctx.fillStyle = "rgba(" + col + "," + (0.10 + prog * 0.16).toFixed(3) + ")";
  ctx.fillRect(x0, y0, hair, h);
  ctx.fillRect(x0 + w - hair, y0, hair, h);
}

function drawEnemyWeapon(e) {
  const dir = e.facing > 0 ? 1 : -1;
  const feet = e.y + e.h;
  const cx = Math.round(e.x + e.w / 2 - cam.x);
  const UP = -Math.PI / 2;

  /* THE DROP.
     A sentry's warning has to be legible from the FLOOR, because that is where
     the player's eyes are -- a tell drawn up on the roofline is a tell nobody
     sees. So the crouch paints the shaft of air it is about to fall through and
     puts a bright pad on the ground it will land on, and both brighten as the
     crouch runs out. The dive then draws the weapon leading the body down. */
  if (e.ledge) {
    const cols = e.kind === "charger" ? CHG_STEEL
               : e.kind === "warden" ? WARD_STEEL : RUSH_STEEL;
    if (e.state === "perchWind") {
      const w = 1 - Math.max(0, e.timer) / PERCH_WIND;
      /* Drawn over the LANDING column, not over the sentry's own. Drawn over
         its own, the shaft for a body standing on a 32px cover block lay
         entirely inside that block -- 32 pixels of hatching on top of 32 pixels
         of brick, invisible, while the pad sat under its boots. The drop drifts
         sideways, so the warning belongs where the drop ends. */
      const tgt = diveTargetOf(e);
      const gy = tgt.row * TILE;
      // No shaft when there is nothing to fall through: the pad alone says
      // "here", and eight pixels of hatching inside a cover block says nothing.
      if (gy - feet > 4) {
        // The drop wipes DOWNWARD, so it gets its own axis rather than being
        // squeezed into the horizontal one.
        hazardPreviewV(tgt.cx - e.w / 2 - cam.x, feet - cam.y, e.w,
                       gy - feet, w, "255,150,120");
      }
      ctx.fillStyle = "rgba(255,160,120," + (0.30 + w * 0.5).toFixed(3) + ")";
      ctx.fillRect(Math.round(tgt.cx - e.w / 2 - 5 - cam.x),
                   Math.round(gy - 2 - cam.y), e.w + 10, 2);
      // The coiled weapon, held low and across the body.
      windupSteel(cx, Math.round(feet - 18 - cam.y), dir, w, 18, 14, -0.5, cols);
    } else if (e.state === "dive") {
      const bx = Math.round(e.x + e.w / 2 - cam.x), by = Math.round(feet - cam.y);
      /* The weapon leads the body DOWN, and it has to be long enough to read
         against a 44px sprite -- a short stub under the feet looks like part of
         the boot rather than like steel. */
      for (let i = 0; i < 26; i += 2) {
        const k = 1 - i / 26;                   // 1 at the point, 0 at the body
        const t2 = Math.max(2, Math.round(9 * (0.25 + k * 0.75)));
        ctx.fillStyle = k > 0.78 ? cols[0] : k > 0.46 ? cols[1] : cols[2];
        ctx.fillRect(bx - (t2 >> 1) + dir * 3, by + i - 14, t2, 2);
      }
      ctx.fillStyle = cols[0];                  // the point
      ctx.fillRect(bx - 2 + dir * 3, by + 12, 5, 4);
      // Speed lines trailing UP out of the frame: the read is "this came from
      // above", and a falling body with nothing behind it reads as a jump.
      ctx.fillStyle = "rgba(214,228,255,0.30)";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(bx - 9 + i * 9, Math.round(e.y - cam.y) - 22 - i * 5, 2, 12);
      }
    }
    return;
  }

  if (e.kind === "charger") {
    // Heavy overhead: the widest arc in the game, matching a 32px box that
    // reaches from 42px up to 6px above the feet.
    const cy = Math.round(feet - CHG_HIT_TOP + 10 - cam.y);
    const rx = e.w / 2 + CHG_HIT_W - 2, ry = (CHG_HIT_TOP - CHG_HIT_BOT) / 2 + 8;
    if (e.state === "windup") {
      const w = 1 - Math.max(0, e.timer) / CHG_WINDUP;
      windupSteel(cx, cy, dir, w, rx, ry, UP, CHG_STEEL);
      hazardPreview(dir > 0 ? e.x + e.w - cam.x : e.x - CHG_HIT_W - cam.x,
                    feet - CHG_HIT_TOP - cam.y, CHG_HIT_W,
                    CHG_HIT_TOP - CHG_HIT_BOT, w, "255,196,110", dir);
    } else if (e.state === "swing") {
      sweepArc(cx, cy, dir, 1 - Math.max(0, e.timer) / CHG_SWING,
               rx, ry, 9, UP, Math.PI, CHG_STEEL);
    } else if (e.state === "lungeWind") {
      const w = 1 - Math.max(0, e.timer) / CHG_LUNGE_WIND;
      windupSteel(cx, Math.round(feet - LUNGE_HIT_TOP + 8 - cam.y), dir, w, 20, 16,
                  0.25, CHG_STEEL);
      // The lunge covers ground, so the preview is the whole corridor it crosses.
      hazardPreview(dir > 0 ? e.x + e.w - cam.x : e.x - CHG_LUNGE_DIST - cam.x,
                    feet - LUNGE_HIT_TOP - cam.y, CHG_LUNGE_DIST,
                    LUNGE_HIT_TOP - LUNGE_HIT_BOT, w, "255,150,90", dir);
    } else if (e.state === "lunge") {
      thrustStreak(e.x + (dir > 0 ? e.w - 6 : 6) - cam.x,
                   feet - LUNGE_HIT_TOP + 12 - cam.y, dir,
                   LUNGE_HIT_W + 16, 7, CHG_STEEL);
    }
    return;
  }

  if (e.kind === "warden") {
    // A low polearm sweep, so it comes in UNDER a jump instead of over a crouch.
    const cy = Math.round(feet - WARD_SWEEP_TOP / 2 - 2 - cam.y);
    const rx = e.w / 2 + WARD_SWEEP_REACH - 6, ry = 20;
    if (e.state === "sweepWind") {
      const w = 1 - Math.max(0, e.timer) / WARD_SWEEP_WIND;
      windupSteel(cx, cy, dir, w, rx, ry, -1.15, WARD_STEEL);
      hazardPreview(dir > 0 ? e.x + e.w - cam.x : e.x - WARD_SWEEP_REACH - cam.x,
                    feet - WARD_SWEEP_TOP - cam.y, WARD_SWEEP_REACH,
                    WARD_SWEEP_TOP - WARD_SWEEP_BOT, w, "150,228,244", dir);
    } else if (e.state === "sweep") {
      sweepArc(cx, cy, dir, 1 - Math.max(0, e.timer) / WARD_SWEEP_TIME,
               rx, ry, 8, -1.15, 1.9, WARD_STEEL);
    } else if (e.state === "aim") {
      /* The polearm comes LEVEL as it aims, along the exact line the shot will
         travel, and a sight line runs ahead of it. That line is why the warden
         was unreadable: the bullet's height was a constant nobody could see, so
         "crouch or die" arrived with no notice. */
      const ay = Math.round(feet - BULLET_Y_OFF - cam.y);
      const w = 1 - Math.max(0, e.timer) / WARD_AIM;
      thrustStreak(cx + dir * 4, ay, dir, 12 + Math.round(w * 14), 4, WARD_STEEL);
      ctx.fillStyle = "rgba(180,230,255," + (0.10 + w * 0.26).toFixed(3) + ")";
      for (let i = 26; i < WARD_RANGE; i += 8) {
        ctx.fillRect(Math.round(cx + dir * i), ay, 4, 1);
      }
    }
    return;
  }

  // Rusher: a kunai held out on the leap, thrust on the lunge.
  if (e.state === "leap") {
    thrustStreak(e.x + (dir > 0 ? e.w - 6 : 6) - cam.x,
                 feet - LEAP_HIT_TOP + 8 - cam.y, dir, LEAP_HIT_W + 14, 5, RUSH_STEEL);
  } else if (e.state === "lunge" || e.state === "lungeWind") {
    thrustStreak(e.x + (dir > 0 ? e.w - 6 : 6) - cam.x,
                 feet - LUNGE_HIT_TOP + 10 - cam.y, dir,
                 LUNGE_HIT_W + 16, 6, RUSH_STEEL);
  }
}

/* OFF-SCREEN BODIES ARE NOT DRAWN.
   update() has culled enemies to ACTIVE_MARGIN since the AI was written; this
   function never did, and nobody measured it. The stage holds 56 enemies and
   about two are on screen, so every frame painted fifty-four characters into
   the void a pixel at a time: 44,685 of the frame's 52,229 fillRect calls, 86%
   of the entire draw, for nothing.

   The margin is wider than the sprite so a body sliding in at the edge is
   already drawn before any part of it should be visible, and it is checked
   against the SPRITE box rather than the collision box -- the art is wider than
   the body and would otherwise pop in.                                       */
const DRAW_MARGIN = SPRITE_W + 16;
function onScreen(o) {
  return o.x + (o.w || 0) > cam.x - DRAW_MARGIN && o.x < cam.x + VIEW_W + DRAW_MARGIN;
}

function drawEntities() {
  for (const p of pickups) {
    if (p.taken || !onScreen(p)) continue;
    const bob = Math.round(Math.sin(clock * 3.3 + p.x) * 2);
    drawShurikenIcon(Math.round(p.x - cam.x), Math.round(p.y - cam.y) + bob, 10,
                     Math.floor(clock * 8) % 2 === 0);
  }

  for (const f of flags) {
    if (f.taken || !onScreen(f)) continue;
    // The banner ripples by shifting a pixel, so it never detaches from the pole.
    const wave = Math.floor(clock * 5) % 2;
    drawPixels(FLAG_SPRITE, Math.round(f.x - cam.x),
               Math.round(f.y - cam.y) + wave, false, P_FLAG, CELL_PROP);
  }

  for (const e of enemies) {
    if (!onScreen(e)) continue;
    /* THE IMPACT FRAME. Two frames of flat white in the shape the body was in,
       drawn after it is already dead and before the burst has spread. The
       oldest trick in fighting games and still the cheapest way to make a hit
       land: the eye reads the silhouette change as the moment of contact, so
       the hit has a frame of its own instead of the body simply ceasing to be
       drawn. Run-coalesced, so it costs about forty rects. */
    if (!e.alive) {
      if (e.impact > 0) {
        const ip = ENEMY_POSES[e.kind][enemyPoseOf(e)] || ENEMY_POSES[e.kind].base;
        drawSilhouette(ip, Math.round(e.x - cam.x - (SPRITE_W - ENEMY_W) / 2),
                       Math.round(e.y + ENEMY_H - NINJA_ROWS * CELL_NINJA - cam.y),
                       e.facing === -1, "#FFFFFF", CELL_NINJA);
      }
      continue;
    }
    const pal = e.kind === "charger" ? P_CHARGER
              : e.kind === "rusher"  ? P_RUSHER : P_WARDEN;
    const poseName = enemyPoseOf(e);
    const rows = ENEMY_POSES[e.kind][poseName];
    const sx = Math.round(e.x - cam.x - (SPRITE_W - ENEMY_W) / 2);
    const sy = Math.round(e.y + ENEMY_H - NINJA_ROWS * CELL_NINJA - cam.y);
    /* BEHIND THE WALL. While it peeks and climbs, only the rows above the
       coping are drawn -- so the wall hides the rest of it and the head and
       shoulders read as looking over the top.

       Done by slicing rows off the BOTTOM rather than by clipping the canvas:
       the sprite is drawn from its top-left, so a shorter array occupies the
       same pixels minus the ones that should be hidden, and it costs nothing.
       It also means the effect survives the optional-asset path, which draws
       from an atlas and has no rows to clip. */
    if (e.vault && (e.state === "peek" || e.state === "climb")) {
      const show = Math.floor((WALL_TOP - sy) / CELL_NINJA);
      if (show <= 0) continue;
      drawPixels(rows.slice(0, Math.min(rows.length, show)), sx, sy,
                 e.facing === -1, pal, CELL_NINJA);
      continue;
    }
    drawPose(rows, e.kind + "/" + poseName, sx, sy, e.facing === -1, pal, CELL_NINJA);
    /* The weapon goes on TOP of the body, so the steel is never buried under
       the shoulder it swings from. */
    drawEnemyWeapon(e);
    /* Telegraph. The tick that was here was four pixels of flat yellow; it said
       "committing" and nothing else. It now PULSES over the windup -- widening
       and brightening as the attack gets closer -- so the bar itself counts down
       the time you have, and it is drawn for every committed state rather than
       the three that happened to be listed. */
    const WIND = { windup: CHG_WINDUP, lungeWind: CHG_LUNGE_WIND,
                   sweepWind: WARD_SWEEP_WIND, aim: WARD_AIM,
                   // The sentry's crouch is a windup like any other, and it was
                   // the one committed state with no bar over the head.
                   perchWind: PERCH_WIND };
    const full = WIND[e.state];
    if (full !== undefined) {
      const w = Math.max(0, Math.min(1, 1 - Math.max(0, e.timer) / full));
      const bw = 4 + Math.round(w * 8);
      ctx.fillStyle = w > 0.75 ? "#FFFFFF" : w > 0.45 ? "#FFE45E" : "#C8922F";
      ctx.fillRect(Math.round(e.x + e.w / 2 - cam.x) - (bw >> 1), sy - 8, bw, 3);
    } else if (e.state === "leap" || e.state === "lunge" || e.state === "swing" ||
               e.state === "sweep" || e.state === "burst") {
      ctx.fillStyle = "#FF8A5A";                  // committed: no longer a warning
      ctx.fillRect(Math.round(e.x + e.w / 2 - cam.x) - 6, sy - 8, 12, 3);
    }
  }

  // A thrown blade arc rather than a pellet: the warden carries a polearm, not
  // a gun. The crescent is drawn a couple of pixels beyond the hitbox so it
  // reads at 32px; the box itself is unchanged, so the crouch timing is too.
  for (const b of bullets) {
    if (!onScreen(b)) continue;
    const bx = Math.round(b.x - cam.x), by = Math.round(b.y - cam.y);
    ctx.fillStyle = "#8FB6F2";
    ctx.fillRect(bx + 1, by - 3, b.w - 1, 2);
    ctx.fillRect(bx + 1, by + b.h + 1, b.w - 1, 2);
    ctx.fillStyle = "#CFE4FF";
    ctx.fillRect(bx - 2, by, b.w + 3, b.h);
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(bx - 2, by, 3, b.h);
  }
  for (const s of shurikens) {
    drawShurikenIcon(Math.round(s.x - cam.x), Math.round(s.y - cam.y), SHURIKEN_SIZE,
                     Math.floor(s.spin * 20) % 2 === 0);
  }
  /* THE BLADE IS THE ARC.
     A 46px hitbox cannot be drawn as a straight blade on a 32px sprite: there
     are about sixteen columns to the right of the hips and that is all the room
     there is. Every version that tried drew a short sword claiming a long
     reach, which is the mismatch that read as wrong -- the effect went far and
     the steel did not.

     So the steel IS the sweep. A half-annulus centred on the shoulder, with its
     OUTER radius set to the hitbox's far edge, which makes the widest point of
     the arc exactly the furthest point the box can hit. It is an ellipse rather
     than a circle because the box is 46 wide and 42 tall: a true circle wide
     enough to reach would tower forty pixels over his head and claim vertical
     reach that does not exist.

     What was here bowed a straight band along a sine curve per row, which is
     not a circle and never looked like one.

     The sweep is revealed top-to-bottom over the hit window, so at any instant
     there is a bright leading edge -- the blade -- with a dimmer trail behind
     it. That is what makes it read as steel travelling rather than as a painted
     crescent that appeared all at once. */
  for (const sl of slashes) {
    if (sl.wind > 0) continue;              // the draw pose is the whole visual
    const kk = Math.max(0, Math.min(1, sl.ttl / SLASH_HIT));
    if (sl.hit) {
      /* Connected. The sweep stops -- it is bright and it sits exactly where
         the death burst spawns, and it used to cover it -- and a radial flash
         takes its place, expanding as it fades. The DEATH is unchanged and
         identical to a ranged kill; this is the sword's own impact, which is
         why it lives here and not in killEnemy(). */
      const cx0 = Math.round(sl.x - cam.x + sl.w / 2);
      const cy0 = Math.round(sl.y - cam.y + sl.h / 2);   // the box, not the body
      const r = Math.round(7 + (1 - kk) * 20);
      /* The impact star used to be white, then pale blue. It is the brightest
         thing on screen for four frames and it was also the least interesting:
         a white star on a white arc over a white flash is one colour event. It
         now runs white -> gold -> ember as it expands, which is the only part
         of the cut that is warm and therefore the part that reads as a hit
         rather than as more steel. */
      ctx.fillStyle = kk > 0.62 ? "#FFFFFF" : kk > 0.34 ? "#FFE98A" : "#FF9A4E";
      for (let a2 = 0; a2 < 8; a2++) {
        const th = (a2 / 8) * Math.PI * 2;
        const sx = cx0 + Math.round(Math.cos(th) * r);
        const sy = cy0 + Math.round(Math.sin(th) * r);
        const long = a2 % 2 === 0 ? 5 : 3;
        if (Math.abs(Math.cos(th)) > 0.7) ctx.fillRect(sx, sy - 1, long, 2);
        else if (Math.abs(Math.sin(th)) > 0.7) ctx.fillRect(sx - 1, sy, 2, long);
        else ctx.fillRect(sx - 1, sy - 1, 3, 3);
      }
      // The horizontal smear behind the star, warm to match it, and additive so
      // it lights what it crosses instead of painting over it.
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,196,120," + (0.26 * kk).toFixed(3) + ")";
      ctx.fillRect(cx0 - r + 3, cy0 - 4, (r - 3) * 2, 8);
      ctx.fillStyle = "rgba(255,120,60," + (0.16 * kk).toFixed(3) + ")";
      ctx.fillRect(cx0 - r - 2, cy0 - 2, (r + 2) * 2, 4);
      ctx.globalCompositeOperation = "source-over";
      continue;
    }
    /* Drawn by ANGLE, not by row, and only over the 180 degrees in front of
       him: theta runs from straight up to straight down on the facing side and
       never crosses behind.

       Scanning rows was the mistake. At the top and bottom of the ellipse the
       inner radius does not intersect that row at all, so the row filled from
       the body's centre outward -- which turned the two ends of a thin band
       into solid wedges and made a 180-degree arc read as a round blob. Walking
       the angle instead gives a band of roughly constant thickness, because the
       thickness is measured along the radius where it belongs. */
    const dir = sl.dir;                     // fixed at the swing, never re-read
    const cx = ninja.x + ninja.w / 2 - cam.x;
    const cy = ninja.y + ninja.h - ARC_CY - cam.y;
    /* An additive underglow, drawn BEFORE the arc and along the same ellipse.
       Additive means it brightens the brick and the bodies the cut passes over
       rather than laying a pale film on top of them, which is the difference
       between a lit blade and a painted one. Three coarse steps, because a
       smooth one bands under nearest-neighbour upscaling. */
    {
      const gp = 1 - kk;
      const grx = BODY_W / 2 + sl.w - 2, gry = ARC_RY;
      ctx.globalCompositeOperation = "lighter";
      for (let g = 0; g < 3; g++) {
        const gsz = 7 + g * 5;
        ctx.fillStyle = g === 0 ? "rgba(120,220,255,0.20)"
                      : g === 1 ? "rgba(80,150,255,0.11)"
                                : "rgba(120,90,255,0.07)";
        const gsteps = 20;
        for (let i = 0; i <= gsteps; i++) {
          const th = -Math.PI / 2 + (i / gsteps) * Math.PI;
          if (th > -Math.PI / 2 + gp * Math.PI) break;
          const gx = cx + dir * grx * 0.9 * Math.cos(th);
          const gy2 = cy + gry * 0.9 * Math.sin(th);
          ctx.fillRect(Math.round(gx - gsz / 2), Math.round(gy2 - gsz / 2), gsz, gsz);
        }
      }
      ctx.globalCompositeOperation = "source-over";
    }
    const rx = BODY_W / 2 + sl.w - 2;       // the hitbox's far edge, exactly
    const ry = ARC_RY;
    const p = 1 - kk;                        // sweep progress, 0 -> 1
    const HALF = Math.PI / 2;
    const leadTh = -HALF + p * Math.PI;      // the blade, travelling downward
    // One step per pixel of arc length, so the squares overlap into a band.
    const steps = Math.max(24, Math.round(Math.PI * Math.max(rx, ry)));
    for (let i = 0; i <= steps; i++) {
      const th = -HALF + (i / steps) * Math.PI;
      if (th > leadTh) break;                // not swept through yet
      const behind = (leadTh - th) / Math.PI;   // 0 at the blade, 1 at the start
      /* The trail tapers behind the blade -- that is what motion blur looks
         like, and a constant-width band reads as a painted shape instead. It
         keeps nearly half its thickness though: tapering it to almost nothing
         left only the bright tip visible, and a bright tip with no visible
         trail behind it reads as a detached object floating near the character
         rather than as a sword that came from his hands. */
      const t2 = Math.max(3, ARC_THICK * (1 - behind * 0.55));
      const mr = 1 - (t2 / 2) / rx;          // the mid-thickness radius
      const my = 1 - (t2 / 2) / ry;
      const px = cx + dir * rx * mr * Math.cos(th);
      const py = cy + ry * my * Math.sin(th);
      const sz = Math.max(2, Math.round(t2));
      /* FOUR BANDS, NOT TWO, AND THEY HAVE A HUE.
         The cut was white at the tip and pale blue behind it, which is what
         steel looks like and not what a katana swung by a ninja in a neon alley
         should look like -- it was the one effect in the game with no colour in
         it, next to a wall lit by pink and cyan signs.

         The ramp now runs white -> cyan -> azure -> violet from the blade
         backwards. It reads as the same motion because the VALUE still falls
         monotonically along the trail; the hue is riding on top of a gradient
         that was already there. */
      ctx.fillStyle = behind < 0.05 ? ARC_LEAD
                    : behind < 0.17 ? ARC_NEAR
                    : behind < 0.40 ? ARC_MID : ARC_TAIL;
      ctx.fillRect(Math.round(px - sz / 2), Math.round(py - sz / 2), sz, sz);
    }
  }
}

/* OUT OF SHURIKEN. A red badge beside the face, in WORLD space next to the
   head rather than on the HUD.

   The HUD already carries the count, and that is the right place for it: it is
   where you look when you are deciding something. This is for the other moment
   -- you press C and nothing happens -- and at that moment you are looking at
   the character, not at the top-left corner. It blinks, because a static icon
   pinned to a moving body stops being read after a second or two.

   It sits on the side he is FACING. A warning tucked behind him is a warning
   you find later. */
const WARN_R = "#FF4030", WARN_K = "#2A0D0A", WARN_W = "#FFF0D0";
// Small: 7x6, about a fifth of the head. A badge this close to the face does
// not need size to be noticed -- it needs to be the only red thing there, and
// to move. Bigger than this and it fights the character for the eye, which is
// the opposite of useful when the character is the thing you are steering.
const WARN_W_PX = 7, WARN_H_PX = 6;
/* WHERE IT WILL COME DOWN. Drawn from the moment a vaulter is fired, on the
   ground at its site, tightening as it gets closer. Telegraphing the landing
   spot is the whole reason the drop is fair: without it the entrance is a body
   arriving from off screen into a place you had no way to know about. */
function drawVaultMarkers() {
  for (const e of enemies) {
    // From the climb onward. While it is still peeking, the head over the wall
    // IS the warning -- a ground marker as well would be telling you where it
    // will land before it has decided to come.
    if (!e.alive || !e.vault) continue;
    if (e.state !== "climb" && e.state !== "vault") continue;
    const gy = Math.round(20 * TILE - cam.y) - 1;
    const mx = Math.round(e.landAt - cam.x);
    /* How much of the fall is left: 1 while it is still above the rooftops,
       0 as it touches down. The bracket goes WIDE when it is far and tightens
       as it arrives -- the first version had it the other way round, so the
       telegraph was at its smallest exactly when it was the only warning and
       grew into a shout after the point where it was any use. */
    const k = Math.max(0, Math.min(1, (20 * TILE - ENEMY_H - e.y) / 200));
    const half = Math.round(6 + k * 11);
    const blink = Math.floor(clock * 10) % 2 === 0;
    ctx.fillStyle = blink ? "rgba(255,90,70,0.85)" : "rgba(255,150,120,0.45)";
    ctx.fillRect(mx + 11 - half, gy - 1, half * 2, 2);
    ctx.fillRect(mx + 10, gy - 5, 2, 4);
    ctx.fillRect(mx + 11 - half, gy - 5, 2, 4);
    ctx.fillRect(mx + 9 + half, gy - 5, 2, 4);
    // A falling tick above the marker, so the eye is led up to the body.
    for (let i = 1; i <= 3; i++) {
      const ty = gy - 14 - i * 9;
      if (ty < 0) break;
      ctx.fillStyle = "rgba(255,120,95," + (0.30 - i * 0.07).toFixed(2) + ")";
      ctx.fillRect(mx + 10, ty, 2, 4);
    }
  }
}

function drawLowAmmoWarning() {
  if (mode !== "play" || shurikenAmmo > 0) return;
  // Faster than the old blink, and brighter: at this size the flash is doing
  // the work that the area used to do.
  if (Math.floor(clock * 6) % 2 !== 0) return;
  const bx = Math.round(ninja.x - cam.x) +
             (ninja.facing < 0 ? -WARN_W_PX - 3 : ninja.w + 3);
  const by = Math.round(ninja.y - cam.y) + (ninja.crouch ? 2 : 1);
  /* Two passes: a dark copy one pixel larger, then the red one on top. An
     outline around a shape that is mostly diagonal is far cheaper to draw as a
     second, bigger copy of the shape than as a traced border. */
  for (let pass = 0; pass < 2; pass++) {
    const g = pass === 0 ? 1 : 0;
    ctx.fillStyle = pass === 0 ? WARN_K : WARN_R;
    const h = WARN_H_PX + g * 2;
    for (let i = 0; i < h; i++) {
      const half = Math.max(1, Math.round(((i + 1) / h) * (WARN_W_PX / 2 + g)));
      ctx.fillRect(bx + (WARN_W_PX >> 1) - half + 1, by - g + i, half * 2, 1);
    }
  }
  ctx.fillStyle = WARN_W;                 // the exclamation mark
  ctx.fillRect(bx + 3, by + 2, 1, 2);
  ctx.fillRect(bx + 3, by + 5, 1, 1);
}

function drawNinja() {
  if (ninja.invuln > 0 && Math.floor(ninja.invuln * 12) % 2 === 0) return;
  const rows = NINJA_POSES[poseNameOf(ninja)];
  // Crouch poses put their content 9 rows down, so draw from the STANDING top
  // and the 15 content rows land exactly on the 30px crouch hitbox.
  const topY = ninja.crouch ? ninja.y - (BODY_H - CROUCH_H) : ninja.y;
  drawPose(rows, "ninja/" + poseNameOf(ninja),
           Math.round(ninja.x + SPRITE_OFF_X - cam.x),
           Math.round(topY - cam.y), ninja.facing === -1, P_NINJA, CELL_NINJA);
}

// MM:SS, clamped so a forgotten tab cannot widen the readout and shove the
// rest of the HUD around.
function timeText(sec) {
  const whole = Math.max(0, Math.floor(sec));
  const mm = Math.min(99, Math.floor(whole / 60));
  const ss = mm >= 99 ? 59 : whole % 60;
  return String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}

/* THE READOUT, at device-pixel density.
   Everything here used to be drawn with the 3x5 font. Fifteen pixels per
   character is enough for a label and not enough for a NUMBER you read at a
   glance mid-jump -- every stroke is the same weight as the gaps inside it, so
   "014250" arrives as texture rather than as digits. That is what looked
   low-resolution, and it was: upscaling cannot add detail nobody drew.

   With RENDER_SCALE in place there are four times the pixels available, so this
   is rebuilt on the 5x7 font with:
     - hairline plate borders, one DEVICE pixel wide (half a world unit), which
       the old buffer literally could not express
     - labels at 2px cells and values at 3-4px, so the hierarchy is carried by
       weight rather than by colour alone
     - plates sized from the text they contain rather than from magic numbers,
       so a wider value cannot overrun its own background any more            */

// A plate with a hairline edge and a brighter top lip, so a panel reads as a
// physical card over the alley rather than as a hole cut in it.
function hudPlate(x, y, w, h) {
  const hair = 1 / RENDER_SCALE;
  ctx.fillStyle = "rgba(10,12,20,0.68)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "rgba(150,170,205,0.20)";
  ctx.fillRect(x, y, w, hair);
  ctx.fillRect(x, y + h - hair, w, hair);
  ctx.fillRect(x, y, hair, h);
  ctx.fillRect(x + w - hair, y, hair, h);
  ctx.fillStyle = "rgba(190,210,240,0.10)";
  ctx.fillRect(x + hair, y + hair, w - hair * 2, hair);
}

function drawHud() {
  const hair = 1 / RENDER_SCALE;

  /* LEFT: what you are carrying and what is left of you. */
  const LW = 150, LH = 46;
  hudPlate(4, 4, LW, LH);
  /* The count has no "x" in front of it any more. The shuriken icon is itself
     an X-shaped star and the font has no lower case, so "x6" rendered as "X6"
     immediately to the right of it and the row read "✕ ✕6". */
  drawShurikenIcon(9, 9, 11, Math.floor(clock * 8) % 2 === 0);
  const ammoCol = shurikenAmmo === 0 ? "#FF6A5A"
                : shurikenAmmo <= 2 ? "#FFC24A" : "#EAF0F8";
  drawTextHD(String(shurikenAmmo), 24, 9, ammoCol, 4);
  const ammoEnd = 24 + textWidthHD(String(shurikenAmmo), 4) + 3;
  drawTextHD(shurikenAmmo >= SHURIKEN_MAX ? "FULL" : "SHURIKEN", ammoEnd, 11,
             shurikenAmmo >= SHURIKEN_MAX ? "#8FE38A" : "#8E9AAD", 2);
  // The key each weapon is on, boxed: a key is a thing you press, and a bare
  // letter sitting in a line of prose is not.
  hudKey(ammoEnd + textWidthHD(shurikenAmmo >= SHURIKEN_MAX ? "FULL" : "SHURIKEN", 2) + 2,
         10, "C");

  drawTextHD("BLADE", 9, 24, "#9FD0FF", 2);
  hudKey(9 + textWidthHD("BLADE", 2) + 2, 23, "X");
  const dashX = 62;
  drawTextHD("DASH", dashX, 24, ninja.dashCd > 0 ? "#5C6579" : "#9FD0FF", 2);
  hudKey(dashX + textWidthHD("DASH", 2) + 2, 23, "S");
  /* The dash cooldown is an UNDERLINE beneath its own label, not a bar parked
     off to one side -- floating loose it read as a stray green line rather than
     as the state of that key. What matters is "is it back yet", which an
     underline answers without being read. */
  const cdw = textWidthHD("DASH", 2) - 1;
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  ctx.fillRect(dashX, 32, cdw, hair * 2);
  const cdk = ninja.dashCd > 0 ? 1 - ninja.dashCd / (DASH_TIME + DASH_CD) : 1;
  ctx.fillStyle = cdk >= 1 ? "#8FE38A" : "#FFC24A";
  ctx.fillRect(dashX, 32, Math.round(cdw * cdk * RENDER_SCALE) / RENDER_SCALE, hair * 2);

  // Lives as pips, kills as a number: one you check without reading it, the
  // other you only look at between fights.
  drawTextHD("LIFE", 9, 36, "#8E9AAD", 2);
  for (let i = 0; i < START_LIVES; i++) {
    const held = i < lives;
    ctx.fillStyle = held ? "#E8563F" : "#333A4A";
    ctx.fillRect(34 + i * 9, 35, 7, 7);
    ctx.fillStyle = held ? "rgba(255,210,170,0.85)" : "rgba(255,255,255,0.06)";
    ctx.fillRect(34 + i * 9, 35, 7, hair);
    if (held) { ctx.fillStyle = "#F7D2AC"; ctx.fillRect(36 + i * 9, 37, 2, 2); }
  }
  drawTextHD("KILL", 66, 36, "#8E9AAD", 2);
  drawTextHD(String(kills), 66 + textWidthHD("KILL", 2) + 3, 36, "#FFE2B0", 2);

  /* CENTRE: the two numbers the run is scored on. */
  const sStr = String(Math.min(999999, score)).padStart(6, "0");
  const tStr = timeText(playTime);
  const sw = textWidthHD(sStr, 4), tw = textWidthHD(tStr, 4);
  const lblS = textWidthHD("SCORE", 2), lblT = textWidthHD("TIME", 2);
  const CW = 12 + lblS + 4 + sw + 14 + lblT + 4 + tw + 10;
  const cx0 = Math.round((VIEW_W - CW) / 2);
  hudPlate(cx0, 4, CW, deaths > 0 ? 40 : 30);
  drawTextHD("SCORE", cx0 + 8, 12, "#8E9AAD", 2);
  drawTextHD(sStr, cx0 + 8 + lblS + 4, 10, "#9CFF7A", 4);
  const tx0 = cx0 + 8 + lblS + 4 + sw + 12;
  ctx.fillStyle = "rgba(255,228,94,0.22)";
  ctx.fillRect(tx0 - 6, 8, hair, 18);
  drawTextHD("TIME", tx0, 12, "#8E9AAD", 2);
  drawTextHD(tStr, tx0 + lblT + 4, 10, "#FFE45E", 4);
  // Once you have died, the figure the bonus is charged against is shown
  // underneath: the clock above it went back to zero and a bonus that shrank
  // for no visible reason reads as a bug.
  if (deaths > 0) {
    drawTextHD("STAGE " + timeText(stageTotal) + "  PAR " + timeText(stagePar()),
               cx0 + 8, 28, stageTotal > stagePar() ? "#E8563F" : "#8E9AAD", 2);
  }

  /* RIGHT: the optional collection. */
  const flagStr = flagsTaken + "/" + flags.length;
  const RW = 20 + textWidthHD("FLAG", 2) + 4 + textWidthHD(flagStr, 3) + 10;
  const rx0 = VIEW_W - 4 - RW;
  hudPlate(rx0, 4, RW, 30);
  ctx.fillStyle = "#2B2622"; ctx.fillRect(rx0 + 8, 8, hair * 2, 20);
  ctx.fillStyle = "#D62E3F"; ctx.fillRect(rx0 + 9, 9, 9, 8);
  ctx.fillStyle = "#FFD24A";
  ctx.fillRect(rx0 + 9, 12 + (Math.floor(clock * 5) % 2), 7, 2);
  drawTextHD("FLAG", rx0 + 22, 12, "#8E9AAD", 2);
  drawTextHD(flagStr, rx0 + 22 + textWidthHD("FLAG", 2) + 4, 10,
             flagsTaken >= flags.length ? "#9CFF7A" : "#FFE45E", 3);
}

/* A boxed key cap. Two device pixels of border and a 2px glyph -- at the old
   resolution this was 6x10 of solid colour with no room for an outline, which
   is why the controls were written out as prose in the debug overlay instead of
   shown on the HUD where they belong. */
function hudKey(x, y, ch) {
  const hair = 1 / RENDER_SCALE;
  const w = textWidthHD(ch, 2) - 1 + 4, h = 7 + 4;
  ctx.fillStyle = "rgba(200,215,240,0.13)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "rgba(200,215,240,0.32)";
  ctx.fillRect(x, y, w, hair); ctx.fillRect(x, y + h - hair, w, hair);
  ctx.fillRect(x, y, hair, h); ctx.fillRect(x + w - hair, y, hair, h);
  drawTextHD(ch, x + 2, y + 2, "#DCE6F5", 2);
}

function drawDebug() {
  const lines = [
    "< > RUN  DOWN CROUCH  Z JUMP  X BLADE  C SHURIKEN  R RESTART  D DEBUG",
    "VX " + ninja.vx.toFixed(0) + "/" + (ninja.crouch ? CROUCH_SPEED : MOVE_SPEED) +
      "  VY " + ninja.vy.toFixed(0) + "  G " + (ninja.vy < 0 ? "RISE" : "FALL") +
      "  POSE " + poseNameOf(ninja) + "  H " + ninja.h,
    "TILE " + Math.floor(ninja.x / TILE) + "/" + COLS + "  CAM " + cam.x +
      "  FOES " + enemies.filter(e => e.alive).length +
      "/" + enemies.length + "  FX " + particles.length,
    "FRAME " + perfMean.toFixed(2) + "MS  WORST " + perfWorst.toFixed(2) +
      "  BUDGET " + FRAME_BUDGET.toFixed(2) +
      "  UPD " + perfUpd.toFixed(2) + "  DRAW " + perfRen.toFixed(2) +
      "  Q " + (quality === Q_FULL ? "FULL" : quality === Q_REDUCED ? "REDUCED" : "MINIMAL")
  ];
  ctx.fillStyle = "rgba(12,14,22,0.58)";
  ctx.fillRect(4, VIEW_H - 35, 8 + textWidthHD(lines[0], 1), 31);
  for (let i = 0; i < lines.length; i++) {
    drawTextHD(lines[i], 8, VIEW_H - 31 + i * 7,
               i === 3 && perfWorst > FRAME_BUDGET ? "#FF9A78" : "#FFE2B0", 1);
  }
  for (const h of hazards) {
    ctx.fillStyle = "rgba(255,80,80,0.45)";
    ctx.fillRect(Math.round(h.x - cam.x), Math.round(h.y - cam.y), h.w, h.h);
  }
  for (const sl of slashes) {
    ctx.fillStyle = "rgba(120,200,255,0.40)";
    ctx.fillRect(Math.round(sl.x - cam.x), Math.round(sl.y - cam.y), sl.w, sl.h);
  }
}

// Desaturation is a CSS filter on the canvas ELEMENT, so the compositor does it
// on the GPU for free. The getImageData/putImageData alternative would be
// ~230k pixel writes per frame at 640x360. The string is cached because writing
// canvas.style every frame invalidates style even when the value is unchanged.
let screenFilter = "";
function applyScreenFilter() {
  const g = deathGrey();
  const want = g > 0 ? "grayscale(" + g.toFixed(3) + ")" : "";
  if (want === screenFilter) return;
  screenFilter = want;
  if (canvas.style) canvas.style.filter = want;
}

/* --- MENU SCREENS --------------------------------------------------------- */

function drawButton(b, scale) {
  const on = hover === b;
  // Unhovered, the frame ticks between two golds so the button reads as live
  // even with no pointer on screen.
  const frame = on ? "#FFF6C4" : (Math.floor(clock * 2.5) % 2 ? "#FFE45E" : "#C8922F");
  ctx.fillStyle = on ? "#FFE45E" : "#141A28";
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = frame;
  ctx.fillRect(b.x, b.y, b.w, 2);
  ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2);
  ctx.fillRect(b.x, b.y, 2, b.h);
  ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);
  // The old 3x5 scale maps to an HD cell one step larger, which lands within a
  // pixel of the same cap height with a great deal more detail in it.
  const px = scale + 1;
  drawTextHD(b.label, b.x + (b.w - textWidthHD(b.label, px)) / 2,
             b.y + Math.round((b.h - FONT_HD_H * px / RENDER_SCALE) / 2),
             on ? "#141018" : "#FFE45E", px);
}

function drawCredits() {
  ctx.fillStyle = "rgba(6,8,13,0.90)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const hair = 1 / RENDER_SCALE;
  ctx.fillStyle = "#FFE45E";
  ctx.fillRect(84, 30, VIEW_W - 168, hair * 2);
  ctx.fillRect(84, VIEW_H - 62, VIEW_W - 168, hair * 2);
  const t1 = "CREDITS";
  drawTextHD(t1, (VIEW_W - textWidthHD(t1, 5)) / 2, 40, "#FFE45E", 5);
  // Left-aligned on a common margin rather than centred: a centred list of
  // mixed-length lines has no edge for the eye to follow down.
  const x0 = 96;
  CREDITS.forEach(([indent, text, col], i) => {
    // Pitch derived from the list length rather than fixed: the list grew from
    // twelve lines to sixteen when the music became an asset, and a fixed 16px
    // pitch ran the last two entries through the bottom rule.
    const pitch = Math.min(16, Math.floor((VIEW_H - 68 - 74) / CREDITS.length));
    drawTextHD(text, x0 + indent * 14, 72 + i * pitch, col, indent >= 2 ? 2 : 3);
  });
  drawButton(BTN_BACK, 2);
}

function drawTitle() {
  // The live alley stays visible behind the logo -- dimmed, not replaced.
  ctx.fillStyle = "rgba(8,10,16,0.66)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "#FFE45E";
  ctx.fillRect(84, 40, VIEW_W - 168, 2);
  ctx.fillRect(84, VIEW_H - 40, VIEW_W - 168, 2);

  const t1 = "NEON SHINOBI";
  drawTextHD(t1, (VIEW_W - textWidthHD(t1, 7)) / 2, 54, "#FFE45E", 7);
  const t2 = "STEEL IN THE BACK ALLEYS";
  drawTextHD(t2, (VIEW_W - textWidthHD(t2, 3)) / 2, 92, "#C9D2E0", 3);

  // A score attack with no record to beat has nothing to come back for.
  const rec = bestFor(STAGE_ID);
  if (rec.score > 0 || rec.time > 0) {
    const line = "BEST " + String(Math.min(999999, rec.score)).padStart(6, "0") +
                 (rec.time > 0 ? "    " + timeText(rec.time) : "");
    drawTextHD(line, (VIEW_W - textWidthHD(line, 3)) / 2, 108, "#9CFF7A", 3);
  }

  /* He breathes on the title screen, so it never reads as a still image.

     drawPose, not drawPixels. These two menu sprites were the last places that
     reached past the asset layer straight into the pixel arrays, so with an
     atlas loaded the ninja on the title screen was a DIFFERENT CHARACTER from
     the one in the alley -- the built-in art on one screen and the replacement
     on the next. Anything that draws a character goes through drawPose; that is
     the whole point of there being one function for it. */
  /* THE LINEUP. One breathing ninja used to stand here, which told the player
     nothing about what is down the alley -- and with four characters now drawn
     from three different CC0 packs, "who is who" is the thing most worth saying
     on this screen. So the roster is the logo art: the shinobi facing right,
     the three who come at him facing left, each under its own name.

     They are drawn through drawPose like everything else, so this screen shows
     exactly the art the alley does. The last time these two disagreed, the
     title screen was showing a different character from the game. */
  const breathing = (Math.floor(clock * 2.5) % 2) !== 0;
  const LINE_Y = 126, PITCH = 108;
  const lineup = [
    [NINJA_IDLE, breathing ? "ninja/idleB" : "ninja/idle", P_NINJA, "SHINOBI", false, "#9FD0FF"],
    [ENEMY_POSES.charger.base, "charger/base", P_CHARGER, FOE_NAMES.charger, true, "#EFC08A"],
    [ENEMY_POSES.rusher.base,  "rusher/base",  P_RUSHER,  FOE_NAMES.rusher,  true, "#D2ABF5"],
    [ENEMY_POSES.warden.base,  "warden/base",  P_WARDEN,  FOE_NAMES.warden,  true, "#B4DC8A"]
  ];
  const lx0 = Math.round((VIEW_W - (lineup.length - 1) * PITCH) / 2 - SPRITE_W / 2);
  lineup.forEach(([rows, name, pal, label, flip, col], i) => {
    const x = lx0 + i * PITCH;
    drawPose(rows, name, x, LINE_Y, flip, pal, CELL_NINJA);
    drawTextHD(label, x + Math.round((SPRITE_W - textWidthHD(label, 2)) / 2),
               LINE_Y + 50, col, 2);
  });

  drawButton(BTN_START, 3);
  drawButton(BTN_CREDITS, 2);

  /* Three rows now, not two: the dash is on this list because a move nobody is
     told about is a move nobody uses, and it is the only control that is not
     also written on the HUD. */
  const legend = ["Z JUMP    X BLADE    C SHURIKEN",
                  "SHIFT OR A - DASH",
                  "SPACE PAUSE   R RESTART   M MUTE   K CREDITS"];
  for (let i = 0; i < legend.length; i++)
    drawTextHD(legend[i], (VIEW_W - textWidthHD(legend[i], 3)) / 2, 248 + i * 15,
             i === 1 ? "#9FD0FF" : "#8E9AAD", 3);
  const hint = "CLICK START OR PRESS SPACE";
  if (Math.floor(clock * 1.6) % 2)
    drawTextHD(hint, (VIEW_W - textWidthHD(hint, 3)) / 2, VIEW_H - 62, "#FFE2B0", 3);
}

function drawPause() {
  ctx.fillStyle = "rgba(8,10,16,0.74)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const t1 = "PAUSED";
  drawTextHD(t1, (VIEW_W - textWidthHD(t1, 5)) / 2, 92, "#FFE45E", 5);
  drawButton(BTN_RESUME, 2);
  drawButton(BTN_RESTART, 2);
  const rows = ["SCORE " + score,
                "TIME " + timeText(playTime) + "   STAGE " + timeText(stageTotal),
                "FLAGS " + flagsTaken + " / " + flags.length,
                "KILLS " + kills + "    DEATHS " + deaths];
  for (let i = 0; i < rows.length; i++)
    drawTextHD(rows[i], (VIEW_W - textWidthHD(rows[i], 3)) / 2, 246 + i * 14,
             "#FFE2B0", 3);
  const hint = "SPACE RESUME";
  drawTextHD(hint, (VIEW_W - textWidthHD(hint, 3)) / 2, VIEW_H - 54, "#8E9AAD", 3);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(8,10,16,0.80)";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "#C2413A";
  ctx.fillRect(84, 44, VIEW_W - 168, 2);
  ctx.fillRect(84, VIEW_H - 46, VIEW_W - 168, 2);

  const t1 = "GAME OVER";
  drawTextHD(t1, (VIEW_W - textWidthHD(t1, 7)) / 2, 62, "#E8563F", 7);
  const t2 = "ALL " + START_LIVES + " LIVES SPENT";
  drawTextHD(t2, (VIEW_W - textWidthHD(t2, 3)) / 2, 100, "#C9D2E0", 3);

  const rows = [
    "SCORE   " + score,
    "BEST    " + bestFor(STAGE_ID).score,
    "STAGE   " + timeText(stageTotal),
    "FLAGS   " + flagsTaken + " / " + flags.length,
    "KILLS   " + kills,
    "REACHED " + Math.round(Math.max(0, Math.min(100,
                  ninja.x / (GOAL_TILE * TILE) * 100))) + " PCT"
  ];
  for (let i = 0; i < rows.length; i++)
    drawTextHD(rows[i], (VIEW_W - textWidthHD(rows[0], 3)) / 2, 130 + i * 14,
             "#FFE2B0", 3);

  if (!canSkipGameOver()) return;
  drawButton(BTN_TITLE, 2);
  if (Math.floor(clock * 1.6) % 2) {
    const hint = "SPACE FOR TITLE    R TO RETRY";
    drawTextHD(hint, (VIEW_W - textWidthHD(hint, 3)) / 2, VIEW_H - 68, "#8E9AAD", 3);
  }
}

function render() {
  applyScreenFilter();
  // The ONE place the buffer scale is applied. Everything below this line is in
  // world units and does not know the difference.
  ctx.save();
  ctx.scale(RENDER_SCALE, RENDER_SCALE);
  renderWorld();
  ctx.restore();
}

function renderWorld() {
  /* THE SHAKE MOVES THE ACTION LAYER, NOT THE BACKGROUND.
     Two reasons, and the first one is not taste. Every parallax layer is drawn
     as full-width bands anchored to the screen; translate those a few pixels
     and a strip of bare canvas opens along one edge, which reads as the picture
     coming loose. The tiles are a world layer that already extends past the
     view, so a shoved action layer reveals the wall behind it instead of
     nothing.

     The second reason is that it looks better. A shaken foreground against a
