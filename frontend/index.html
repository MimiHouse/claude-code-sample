     held sky is what a blow landing in front of the camera looks like; shaking
     the sky too makes the CAMERA the thing that was hit. */
  drawSky();
  drawSkyline();
  // Haze between the two distance bands, so the skyline sits BEHIND the mid
  // buildings rather than beside them.
  drawHazeBand(96, 30, "58,72,112");
  drawMidBuildings();
  drawHazeBand(150, 26, "48,58,92");
  drawFog();
  drawNearWall();
  // Ash falls in front of the wall and behind the action, which is the only
  // place it can be: in front of the tiles it veils the playfield, behind the
  // wall it is invisible.
  drawAsh();

  const shx = shakeOffsetX(), shy = shakeOffsetY();
  const shaking = shx !== 0 || shy !== 0;
  if (shaking) { ctx.save(); ctx.translate(shx, shy); }
  drawTiles();
  drawGoal();
  drawProps();
  drawEntities();
  drawGhosts();     // under the body: a trail in front of it reads as a smear
  drawNinja();      // drawn during "dying" too: the freeze frame IS the effect
  drawVaultMarkers();
  drawParticles();
  if (shaking) ctx.restore();
  // Outside the shake: it is a HUD element pinned to the screen, and a warning
  // that jitters with the world is harder to read exactly when it matters.
  drawLowAmmoWarning();

  if (flash > 0) {
    ctx.fillStyle = "rgba(" + flashCol + "," +
                    Math.min(FLASH_MAX, flash * FLASH_GAIN).toFixed(3) + ")";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  // No HUD on the title screen: nothing it reports is meaningful yet. Nor on
  // the credits, which is a page to read and had the ammo plate over its first
  // two lines.
  if (mode !== "title" && mode !== "gameover" && mode !== "credits") {
    drawHud();
    if (showDebug) drawDebug();
  }

  if (mode === "title") drawTitle();
  else if (mode === "credits") drawCredits();
  else if (mode === "gameover") drawGameOver();
  else if (mode === "paused") drawPause();
  else if (mode === "clear") {
    ctx.fillStyle = "rgba(8,10,16,0.80)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Rank rewards sweeping the flags AND surviving, so the ending reflects how
    // the run actually went rather than just that it ended.
    const allFlags = flagsTaken >= flags.length;
    const rank = (allFlags && deaths === 0) ? "S" : allFlags ? "A"
               : flagsTaken >= 7 ? "B" : "C";
    const rankCol = rank === "S" ? "#9CFF7A" : rank === "A" ? "#FFE45E"
                  : rank === "B" ? "#FFB55E" : "#C9D2E0";

    ctx.fillStyle = "#FFE45E";
    ctx.fillRect(84, 44, VIEW_W - 168, 2);
    ctx.fillRect(84, VIEW_H - 46, VIEW_W - 168, 2);

    const t1 = "STAGE CLEAR";
    drawTextHD(t1, (VIEW_W - textWidthHD(t1, 5)) / 2, 60, "#FFE45E", 5);
    const t2 = "RANK " + rank;
    drawTextHD(t2, (VIEW_W - textWidthHD(t2, 4)) / 2, 98, rankCol, 4);
    if (newRecord && Math.floor(clock * 2.5) % 2) {
      const nr = "NEW RECORD";
      drawTextHD(nr, (VIEW_W - textWidthHD(nr, 3)) / 2, 122, "#9CFF7A", 3);
    }

    const rows = [
      "SCORE   " + score,
      "BEST    " + bestFor(STAGE_ID).score,
      "STAGE   " + timeText(stageTotal) + " / PAR " + timeText(stagePar()),
      "BONUS   " + timeBonus + (timeBonus ? "" : "  OVER PAR"),
      "FLAGS   " + flagsTaken + " / " + flags.length,
      "KILLS   " + kills,
      "DEATHS  " + deaths
    ];
    const widest = rows.reduce((a, b) => (b.length > a.length ? b : a), rows[0]);
    for (let i = 0; i < rows.length; i++) {
      drawTextHD(rows[i], (VIEW_W - textWidthHD(widest, 3)) / 2, 138 + i * 13, "#FFE2B0", 3);
    }

    // The ninja stands at the gate, scarf still fluttering. Through drawPose,
    // for the same reason the title screen does.
    const endBreathing = (Math.floor(clock * 2.5) % 2) !== 0;
    drawPose(endBreathing ? NINJA_IDLE_B : NINJA_IDLE,
             endBreathing ? "ninja/idleB" : "ninja/idle",
             (VIEW_W - SPRITE_W) / 2, 194, false, P_NINJA, CELL_NINJA);

    const t3 = "PRESS R TO RESTART";
    drawTextHD(t3, (VIEW_W - textWidthHD(t3, 3)) / 2, VIEW_H - 68, "#C9D2E0", 3);
  }
}

/* --- LOOP ----------------------------------------------------------------- */
/* Fixed timestep: rAF hands us a variable dt, and integrating it directly would
   make the game feel different on 144Hz than 60Hz. Draining a fixed 1/60 step
   keeps feel identical and bounds per-step displacement.                     */

let last = performance.now();
let acc = 0;

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > STEP * MAX_STEPS) dt = STEP * MAX_STEPS;
  acc += dt;
  // performance.now() is absent in the headless harness, where the whole
  // measurement is meaningless and must cost nothing.
  const clk = typeof performance !== "undefined" && performance.now
            ? () => performance.now() : null;
  const t0 = clk ? clk() : 0;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  pumpMusic();
  updateCamera();
  const t1 = clk ? clk() : 0;
  render();
  if (clk) {
    const t2 = clk();
    perfUpd = t1 - t0; perfRen = t2 - t1;
    perfSample(t2 - t0);
  }
  requestAnimationFrame(frame);
}

restart();
mode = "title";     // the game opens on the title screen, not mid-alley
// Fired and forgotten: the game is already playable, and anything that loads
// simply replaces a built-in the next time it is drawn or played.
loadAssets();
requestAnimationFrame(frame);
</script>
</body>
</html>
