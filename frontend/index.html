  src.buffer = CUES.music;
  src.loop = true;
  src.connect(musicGain);
  src.start(actx.currentTime);
  musicSample = src;
}

function stopMusicSample() {
  if (!musicSample) return;
  try { musicSample.stop(); } catch (err) { /* already stopped */ }
  musicSample = null;
}

/* --- INPUT ---------------------------------------------------------------- */
/* The ninja may walk back, but the STAGE may not: the camera is a one-way
   ratchet, so ground you have scrolled past is gone for good and the screen's
   left edge becomes a solid wall. Actions are exactly Z / X / C; ArrowDown
   crouches. R and D are utilities.                                          */

const keys = new Set();
// Space and Enter are in here for preventDefault as much as for the binding:
// without it the browser scrolls the page out from under the canvas.
const HANDLED = new Set([
  "ArrowLeft", "ArrowRight", "ArrowDown", "KeyZ", "KeyX", "KeyC", "KeyR", "KeyD",
  "Space", "Enter", "KeyM", "KeyK",
  // Dash is on Shift and mirrored on A: Shift is where the hands already are,
  // and A is there for keyboards that swallow Shift under sticky-keys.
  "ShiftLeft", "ShiftRight", "KeyA"
]);
const DASH_KEYS = new Set(["ShiftLeft", "ShiftRight", "KeyA"]);

/* --- MENUS ---------------------------------------------------------------- */
/* Buttons are plain rects in view space, hit-tested for the mouse and mirrored
   by the keyboard, so neither input is the "real" one. Drawing them on the game
   canvas rather than in DOM keeps the bitmap font and the palette.          */

const BTN_START   = { x: 246, y: 196, w: 148, h: 32, label: "START" };
const BTN_RESUME  = { x: 246, y: 152, w: 148, h: 28, label: "RESUME" };
const BTN_RESTART = { x: 246, y: 192, w: 148, h: 28, label: "RESTART" };
const BTN_TITLE   = { x: 246, y: 214, w: 148, h: 28, label: "TITLE" };
// Beside START rather than under it: under it landed on the control legend,
// where it was clickable and invisible.
const BTN_CREDITS = { x: 404, y: 200, w: 104, h: 24, label: "CREDITS" };
const BTN_BACK    = { x: 246, y: VIEW_H - 46, w: 148, h: 26, label: "BACK" };

let hover = null;                 // button under the pointer, for the highlight

function buttonsFor(m) {
  if (m === "title") return [BTN_START, BTN_CREDITS];
  if (m === "credits") return [BTN_BACK];
  if (m === "paused") return [BTN_RESUME, BTN_RESTART];
  if (m === "gameover") return canSkipGameOver() ? [BTN_TITLE] : [];
  return [];
}

// The summary is unskippable for a moment, so the key that killed you cannot
// also dismiss it.
function canSkipGameOver() {
  return GAMEOVER_TIME - gameOverT >= GAMEOVER_LOCK;
}

// The canvas is scaled by CSS, so client pixels are not view pixels.
function canvasPos(ev) {
  const r = canvas.getBoundingClientRect();
  const sx = r.width ? VIEW_W / r.width : 1;
  const sy = r.height ? VIEW_H / r.height : 1;
  return { x: (ev.clientX - r.left) * sx, y: (ev.clientY - r.top) * sy };
}

function hitButton(pos) {
  for (const b of buttonsFor(mode)) {
    if (pos.x >= b.x && pos.x < b.x + b.w &&
        pos.y >= b.y && pos.y < b.y + b.h) return b;
  }
  return null;
}

function startGame() {
  restart();                      // lands in "play"
}

function toTitle() {
  restart();                      // a fresh alley behind the logo
  mode = "title";
}

function togglePause() {
  if (mode === "play") mode = "paused";
  else if (mode === "paused") mode = "play";
}

addEventListener("keydown", (e) => {
  if (HANDLED.has(e.code)) e.preventDefault();
  if (keys.has(e.code)) return;          // key-repeat guard: Z/X/C are discrete
  keys.add(e.code);
  audioUnlock();                         // a keypress is the gesture browsers want
  if (e.code === "KeyM") { toggleMute(); return; }

  // The debug toggle is a development key, so it answers from any screen rather
  // than being shadowed by whichever menu happens to be up.
  if (e.code === "KeyD") { showDebug = !showDebug; return; }

  // The menus own the rest of the keyboard before the ninja does, so Z cannot
  // buffer a jump on the title screen and land it the moment play begins.
  if (mode === "title") {
    if (e.code === "KeyK") { mode = "credits"; return; }
    if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") startGame();
    return;
  }
  // Any key leaves the credits. It is a page to read, not a menu to operate.
  if (mode === "credits") { mode = "title"; return; }
  if (mode === "gameover") {
    if (!canSkipGameOver()) return;
    if (e.code === "KeyR") startGame();                     // straight to a retry
    else if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") toTitle();
    return;
  }
  if (e.code === "Space") { togglePause(); return; }
  if (e.code === "KeyR") { restart(); return; }
  if (mode === "paused") return;

  if (e.code === "KeyZ") ninja.buffer = JUMP_BUFFER;
  if (e.code === "KeyX") attack();
  if (e.code === "KeyC") throwShuriken();
  if (DASH_KEYS.has(e.code)) startDash();
});
addEventListener("keyup", (e) => {
  if (HANDLED.has(e.code)) e.preventDefault();
  keys.delete(e.code);
  if (e.code === "KeyZ" && ninja.vy < 0) ninja.vy = Math.max(ninja.vy, -JUMP_CUT);
});
// Losing focus while paused must not resume, and must not leave a key stuck.
addEventListener("blur", () => keys.clear());

canvas.addEventListener("mousemove", (ev) => { hover = hitButton(canvasPos(ev)); });
canvas.addEventListener("mouseleave", () => { hover = null; });
canvas.addEventListener("click", (ev) => {
  audioUnlock();
  const b = hitButton(canvasPos(ev));
  if (!b) return;
  if (b === BTN_START) startGame();
  else if (b === BTN_CREDITS) mode = "credits";
  else if (b === BTN_BACK) mode = "title";
  else if (b === BTN_RESUME) togglePause();
  else if (b === BTN_RESTART) restart();
  else if (b === BTN_TITLE) toTitle();
});

/* --- COLLISION ------------------------------------------------------------ */

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function blockedAt(x, y, w, h) {
  const tx0 = Math.floor(x / TILE), tx1 = Math.floor((x + w - 1) / TILE);
  const ty0 = Math.floor(y / TILE), ty1 = Math.floor((y + h - 1) / TILE);
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++) if (solidAt(tx, ty)) return true;
  return false;
}

// "Am I standing on something?" is a different question from "did I just
// collide?" -- resting flush produces zero overlap, so a collision-driven flag
// flickers off on alternate frames and silently refills coyote time.
function probeGround(e) {
  const ty = Math.floor((e.y + e.h) / TILE);
  const tx0 = Math.floor(e.x / TILE), tx1 = Math.floor((e.x + e.w - 1) / TILE);
  for (let tx = tx0; tx <= tx1; tx++) if (solidAt(tx, ty)) return true;
  return false;
}

function moveX(e, dx) {
  if (dx === 0) return;
  e.x += dx;
  const ty0 = Math.floor(e.y / TILE), ty1 = Math.floor((e.y + e.h - 1) / TILE);
  if (dx > 0) {
    // e.x+e.w, not -1, for the same reason moveY does it: the snap below puts
    // the body FLUSH against the tile, so the test has to register contact
    // flush too or the snap is not idempotent. With the -1 a body held against
    // a wall crept half a pixel in over two frames and was shoved back out on
    // the third -- a three-frame limit cycle that moved the drawn sprite by a
    // pixel at 20Hz and read as the screen shaking.
    const tx = Math.floor((e.x + e.w) / TILE);
    for (let ty = ty0; ty <= ty1; ty++)
      if (solidAt(tx, ty)) { e.x = tx * TILE - e.w; e.vx = 0; return; }
  } else {
    const tx = Math.floor(e.x / TILE);
    for (let ty = ty0; ty <= ty1; ty++)
      if (solidAt(tx, ty)) { e.x = (tx + 1) * TILE; e.vx = 0; return; }
  }
}

function moveY(e, dy) {
  if (dy === 0) return;
  e.y += dy;
  const tx0 = Math.floor(e.x / TILE), tx1 = Math.floor((e.x + e.w - 1) / TILE);
  if (dy > 0) {
    // e.y+e.h, not -1: contact registers flush with the tile top so the snap is
    // idempotent and resting never jitters. Sub-stepping prevents row skips.
    const ty = Math.floor((e.y + e.h) / TILE);
    for (let tx = tx0; tx <= tx1; tx++)
      if (solidAt(tx, ty)) { e.y = ty * TILE - e.h; e.vy = 0; return; }
  } else {
    const ty = Math.floor(e.y / TILE);
    for (let tx = tx0; tx <= tx1; tx++)
      if (solidAt(tx, ty)) { e.y = (ty + 1) * TILE; e.vy = 0; return; }
  }
}

// Sub-stepped so no iteration can move more than TILE-1 and skip a tile.
function moveEntity(e, dx, dy) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (TILE - 1)));
  const sx = dx / n, sy = dy / n;
  for (let i = 0; i < n; i++) { moveX(e, sx); moveY(e, sy); }
}

/* --- PLAYER ACTIONS ------------------------------------------------------- */

function setCrouch(on) {
  if (on === ninja.crouch) return;
  if (on) {
    ninja.y += BODY_H - CROUCH_H;       // keep the feet planted
    ninja.h = CROUCH_H;
    ninja.crouch = true;
  } else {
    const upY = ninja.y - (BODY_H - CROUCH_H);
    if (!blockedAt(ninja.x, upY, ninja.w, BODY_H)) {   // refuse if no headroom
      ninja.y = upY; ninja.h = BODY_H; ninja.crouch = false;
    }
  }
}

// Is anything close enough to hit with the blade? Same footing only, so you
// cannot slash a warden standing on a ledge above you.
function enemyInSlashRange() {
  const dir = ninja.facing < 0 ? -1 : 1;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = (e.x + e.w / 2) - (ninja.x + ninja.w / 2);
    if (dir > 0 ? dx < -4 : dx > 4) continue;             // must be in front
    if (Math.abs(dx) > SLASH_RANGE) continue;
    if (Math.abs((e.y + e.h) - (ninja.y + ninja.h)) > 26) continue;
    return true;
  }
  return false;
}

/* X is the BLADE, always. It used to be context-sensitive -- blade inside
   SLASH_RANGE, shuriken outside it -- which meant the weapon you got depended
   on a distance you could not see, and the shuriken was the one you got most of
   the time. The blade is the basic weapon now: unlimited, and the same button
   whatever the range. The shuriken is on C and is spent. */
function attack() {
  if (mode !== "play") return;
  slash();
}

function slash() {
  if (ninja.slashTimer > 0) return;
  ninja.slashTimer = SLASH_TIME;
  const dir = ninja.facing < 0 ? -1 : 1;
  const feet = ninja.y + ninja.h;
  /* The DIRECTION is recorded here and never recomputed; the POSITION is
     recomputed every frame from wherever the body is.

     The arc used to derive its direction from `sl.x > ninja.x` each frame. The
     box was pinned at the moment of the swing and the player was not, so
     walking through your own cut carried you past the box and flipped the
     comparison partway through -- two half-circles in opposite directions over
     one swing, which is a full 360 on screen.

     Pinning the geometry as well fixed the flip and introduced a worse one: the
     box and the arc stayed where the swing started while the body walked out of
     them, so the sword detached and trailed behind. A swing that follows the
     body is also the better rule -- moving while you cut should sweep the space
     you are moving into. So: direction fixed, position live. */
  slashes.push({
    x: dir > 0 ? ninja.x + ninja.w - 2 : ninja.x - SLASH_W + 2,
    y: feet - SLASH_TOP, w: SLASH_W, h: SLASH_TOP - SLASH_BOT, ttl: SLASH_HIT,
    wind: SLASH_WIND, hit: false, dir: dir
  });
  sfxSlash();
}

/* The dash is refused rather than queued. A buffered dash fires after the
   moment you wanted it, which on a 0.16s move is the difference between
   crossing a gap and walking into it -- so a press during the cooldown is
   simply dropped, and the cooldown is short enough that it does not matter. */
function startDash() {
  if (mode !== "play" || hitFreeze > 0) return;
  if (ninja.dashT > 0 || ninja.dashCd > 0) return;
  if (!ninja.onGround && ninja.airDashes >= DASH_AIR_MAX) return;
  if (!ninja.onGround) ninja.airDashes++;
  ninja.dashT = DASH_TIME;
  ninja.dashCd = DASH_TIME + DASH_CD;
  ninja.dashDir = ninja.facing < 0 ? -1 : 1;
  ninja.ghostT = 0;
  setCrouch(false);          // you cannot slide in a crouch; it would clip low
  sfxDash();
}

/* Afterimages. A flat stamp of the pose the body was in, not a copy of the
   sprite: one colour means the row loop can coalesce into runs, so the whole
   trail costs about what one extra character does. Cheap enough to leave on. */
function pushGhost() {
  ghosts.push({ pose: poseNameOf(ninja), x: ninja.x, y: ninja.y,
                crouch: ninja.crouch, facing: ninja.facing, t: 0 });
}
function updateGhosts(dt) {
  for (const g of ghosts) g.t += dt;
  if (ghosts.length) ghosts = ghosts.filter(g => g.t < GHOST_LIFE);
}
function drawGhosts() {
  for (const g of ghosts) {
    const k = 1 - g.t / GHOST_LIFE;
    const topY = g.crouch ? g.y - (BODY_H - CROUCH_H) : g.y;
    drawSilhouette(NINJA_POSES[g.pose] || NINJA_IDLE,
                   Math.round(g.x + SPRITE_OFF_X - cam.x),
                   Math.round(topY - cam.y), g.facing === -1,
                   "rgba(142,196,255," + (0.44 * k * k).toFixed(3) + ")", CELL_NINJA);
  }
}

/* Ammunition. A throw spends one and is paced by a cooldown rather than by the
   previous shuriken's travel time -- with a finite stock, gating on travel time
   would punish a miss twice. */
function throwShuriken() {
  if (mode !== "play") return;
  if (shurikenAmmo <= 0 || throwCd > 0) { sfxDryFire(); return; }
  shurikenAmmo--;
  throwCd = THROW_COOLDOWN;
  ninja.throwTimer = THROW_TIME;
  // Throw the way he is looking. This was hardcoded rightward while movement
  // was forward-only; now that he can turn, it has to follow `facing`.
  const dir = ninja.facing < 0 ? -1 : 1;
  // Standing: feet-42, so the 10px body spans feet-42..feet-32 and sits entirely
  // ABOVE a 32px cover block -- it flies over. Crouched: feet-20, squarely
  // inside the block, so it is stopped. Stand to shoot, crouch to hide.
  const feet = ninja.y + ninja.h;
  shurikens.push({
    x: dir > 0 ? ninja.x + ninja.w : ninja.x - SHURIKEN_SIZE,
    y: feet - (ninja.crouch ? 20 : 42),
    w: SHURIKEN_SIZE, h: SHURIKEN_SIZE, vx: SHURIKEN_SPEED * dir, spin: 0
  });
  sfxThrow();
}

/* Screen bounds, still used by the wave spawner and by the debug overlay. It
   outlived useNinjutsu(), which is what it was written for: a screen-clearing,
   five-second-invulnerability strike, removed because being untouchable for a
   fifth of a stage is not a difficulty setting, it is an off switch. */
function onScreen(e) {
  return e.x + e.w > cam.x - 8 && e.x < cam.x + VIEW_W + 8;
}

/* The leading edge of a dash or a leap. Pushed fresh every frame with a
   one-frame ttl rather than once for the whole move: the box has to follow the
   body, and a long-lived box would sit where the attack STARTED. */
function leadHazard(e, w, top, bot) {
  const feet = e.y + e.h;
  hazards.push({
    x: e.facing > 0 ? e.x + e.w - 4 : e.x - w + 4,
    // Two frames, not one. The hazard loop does `h.ttl -= dt` and THEN tests
    // `ttl > 0`, so a box with ttl exactly dt is already dead by the time
    // anything looks at it -- it would have been pushed every frame of a dash
    // and hit nothing, ever.
    y: feet - top, w: w, h: top - bot, ttl: 2 / 60
  });
}

/* --- IMPACT FX ------------------------------------------------------------ */
/* A death or a kill used to be a single frame of nothing. Three cheap layers
   give it weight: a particle burst in the victim's own palette, a couple of
   frames of hitstop so the hit registers, and a tinted screen flash.        */

function addTrauma(amount) { trauma = Math.min(1, trauma + amount); }

// Direction is normalised and the magnitude passed separately, so callers say
// "that way, this hard" rather than having to scale a vector themselves.
function addPunch(dx, dy, mag) {
  const len = Math.hypot(dx, dy) || 1;
  punchX += (dx / len) * mag;
  punchY += (dy / len) * mag;
}

function updateShake(dt) {
  trauma = Math.max(0, trauma - TRAUMA_DECAY * dt);
  const k = Math.exp(-PUNCH_DECAY * dt);
  punchX *= k; punchY *= k;
  if (Math.abs(punchX) < 0.05) punchX = 0;
  if (Math.abs(punchY) < 0.05) punchY = 0;
  shakeFrame++;
}

function shakeOffsetX() {
  return Math.round(Math.sin(shakeFrame * 2.31) * SHAKE_PX * trauma * trauma + punchX);
}
function shakeOffsetY() {
  return Math.round(Math.cos(shakeFrame * 3.07) * SHAKE_PX * 0.7 * trauma * trauma + punchY);
}

function spawnBurst(cx, cy, count, colors, speed, life) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.7;
    const sp = speed * (0.4 + Math.random() * 0.8);
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - speed * 0.3,       // biased upward, then gravity
      t: 0, life: life * (0.55 + Math.random() * 0.7),
      c: colors[(Math.random() * colors.length) | 0],
      s: 2 + ((Math.random() * 3) | 0)
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.t < p.life);
}

function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.t / p.life;
    const s = Math.max(1, Math.round(p.s * (0.35 + k * 0.65)));
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), s, s);
  }
}

// First solid row in a column, i.e. the surface a spawned enemy would land on.
function groundTopRow(tx) {
  for (let ty = 0; ty < ROWS; ty++) if (solidAt(tx, ty)) return ty;
  return -1;
}

function spawnWaveRusher() {
  if (enemies.filter(e => e.alive && e.wave).length >= WAVE_MAX_ALIVE) return;
  const tx = Math.floor((cam.x + VIEW_W + 24) / TILE);
  if (tx >= COLS) return;
  const ty = groundTopRow(tx);
  if (ty < 0) return;                                  // over a pit, skip
  for (let k = 1; k <= 3; k++) if (solidAt(tx, ty - k)) return;   // needs headroom
  enemies.push({
    kind: "rusher", x: tx * TILE, y: ty * TILE - ENEMY_H,
    w: ENEMY_W, h: ENEMY_H, vx: 0, vy: 0, onGround: false, facing: -1,
    state: "run", timer: 0, alive: true, dying: 0, lethal: false, wave: true,
    lastX: tx * TILE, stuckT: 0, homeX: tx * TILE + ENEMY_W / 2,
    animTime: 0, walkDist: 0, walkRate: 0, leapT: 0, leapDir: -1,
    leaps: 0, lungeCd: 0, lungeDir: -1, shots: 0
  });
}

/* Fired when the camera gets within VAULT_TRIGGER of a site, so the entrance
   happens on screen -- off screen it is just an enemy that was already there.

   It starts above the top of the view and drifts toward the site while it
   falls, so it crosses the skyline rather than dropping straight down a shaft.
   The horizontal drift is what makes it read as having come from somewhere. */
function fireVault(i) {
  const tx = vaultSites[i];
  const groundY = 20 * TILE;
  const fromLeft = tx * TILE > ninja.x;      // comes in from ahead of you
  const dir = fromLeft ? -1 : 1;
  /* It starts ON the wall line, behind it, and the horizontal offset is how
     far it will drift once it pushes off -- so it comes down on its marker. The
     wall line is a screen constant, so this is where the camera is now; peek
     and climb re-read it every frame in case the camera moves. */
  const wallY = cam.y + WALL_TOP;
  const startY = wallY - VAULT_REVEAL;
  const fallH = Math.max(40, groundY - ENEMY_H - (wallY - ENEMY_H));
  const airT = Math.sqrt(2 * fallH / VAULT_GRAVITY);
  enemies.push({
    kind: "rusher", vault: true, post: false,
    x: tx * TILE - dir * VAULT_VX * airT, y: startY,
    w: ENEMY_W, h: ENEMY_H, vx: 0, vy: 0,
    onGround: false, facing: dir,
    /* Not flagged `wave`. It is transient in the same way -- retired once it is
       dead, so the list cannot grow -- but `wave` also means "spawned by the
       wave timer", and anything that clears waves would otherwise delete a
       vaulter mid-air. */
    state: "peek", timer: VAULT_PEEK, vaultDir: dir,
    alive: true, dying: 0, lethal: false, wave: false,
    lastX: tx * TILE, stuckT: 0, homeX: tx * TILE + ENEMY_W / 2,
    animTime: 0, walkDist: 0, walkRate: 0, leapT: 0, leapDir: -1,
    leaps: 0, lungeCd: 0, lungeDir: -1, shots: 0,
    landAt: tx * TILE                      // where the ground marker is drawn
  });
}

function pumpVaults() {
  for (let i = 0; i < vaultSites.length; i++) {
    if (vaultsFired[i]) continue;
    const sx = vaultSites[i] * TILE;
    if (sx > cam.x - 40 && sx < cam.x + VIEW_W - VAULT_INSET) {
      vaultsFired[i] = true;
      fireVault(i);
    }
  }
}

// Untouchable in the air, and it cannot touch you either. Both halves are
// checked through this one predicate so they cannot drift apart.
const VAULT_STAGES = ["peek", "climb", "vault"];
function vaultAirborne(e) {
  return e.vault === true && VAULT_STAGES.indexOf(e.state) >= 0;
}

/* `silent` also means "by the blade": the arc suppresses the per-body kill cue
   and plays one for the whole swing, and it is the only caller that does. So
   the melee tier is read off it rather than threaded through as a second
   parameter that could disagree with the first. */
function killEnemy(e, silent) {
  const blade = !!silent;
  e.alive = false; e.dying = 0.35; e.impact = IMPACT_TIME; kills++;
  score += SCORE_KILL;
  const pal = e.kind === "charger" ? P_CHARGER
            : e.kind === "rusher"  ? P_RUSHER : P_WARDEN;
  spawnBurst(e.x + e.w / 2, e.y + e.h / 2, blade ? 17 : 13,
             [pal.G, pal.H, pal.D, "#FFFFFF", "#FFE45E"], blade ? 175 : 150, 0.44);
  // Hitstop is raised, never lowered: a second kill inside the first one's
  // freeze must not cut it short.
  hitFreeze = Math.max(hitFreeze, blade ? FREEZE_BLADE : FREEZE_SHURIKEN);
  addTrauma(blade ? TRAUMA_BLADE : TRAUMA_SHURIKEN);
  // The view is shoved AWAY from the player, along the line the blow travelled.
  addPunch((e.x + e.w / 2) - (ninja.x + ninja.w / 2),
           (e.y + e.h / 2) - (ninja.y + ninja.h / 2) - 10,
           blade ? PUNCH_PX : PUNCH_PX * 0.6);
  // Duration, not strength -- FLASH_GAIN carries the cut. It has to outlive the
  // hitstop or it is never seen as its own effect.
  flash = blade ? 0.14 : 0.11; flashCol = "255,250,225";
  // A caller that kills several at once suppresses these: a dozen stacked kill
  // sounds is a noise blast rather than a dozen kills.
  if (!silent) sfxKill();
}

/* BUMPING INTO AN ENEMY. Not lethal -- nothing about an enemy's body is -- but
   not nothing either: walking into one shoves you back and off your feet for a
   moment, with a short grace window so a body you are standing in cannot shove
   you once per frame. Only an attack box kills, and that is checked separately.

   The knock is away from the enemy's centre rather than opposite your own
   facing: walking backwards into one should still push you out, not pull you
   further in. */
const BUMP_VX = 190, BUMP_VY = -170, BUMP_GRACE = 0.28;
function bumpNinja(e) {
  if (ninja.bump > 0 || mode !== "play") return;
  const away = Math.sign((ninja.x + ninja.w / 2) - (e.x + e.w / 2)) || 1;
  ninja.vx = away * BUMP_VX;
  ninja.vy = BUMP_VY;
  ninja.onGround = false;
  ninja.bump = BUMP_GRACE;
  ninja.facing = -away;              // knocked back, still looking at it
  // No hitstop here, deliberately. A couple of frames of freeze reads well on a
  // kill, but a bump can happen on any frame you are touching a body -- so
  // leaning on an enemy stalled the whole world a few frames at a time, which
  // both felt like lag and slowed every enemy on screen while you did it.
  sfxBump();
}

/* The death sting: what fills the silence the music leaves.
   sfxDeath is the impact and has to stay under ~0.35s or it drones under the
   freeze. This is the other half -- a slow falling minor third with a long
   release, timed to resolve inside DEATH_TIME. It only reads as a sting because
   the loop is cut first; over the music it would be one more voice. */
function synth_sfxDeathSting() {
  partial(220.00, 0.55, "triangle", 0.085, 0.10);      // A3
  partial(261.63, 0.55, "triangle", 0.070, 0.10);      // C4 -- the minor third
  partial(110.00, 0.75, "sine", 0.105, 0.12);          // A2 under both
  tail(0.70, 0.045, 700, 0.14);
}
function sfxDeathSting() { playCue("deathSting", synth_sfxDeathSting); }

function killNinja() {
  if (ninja.invuln > 0 || mode !== "play") return;
  deaths++; lives--;
  mode = "dying"; dyingT = DEATH_TIME;
  /* The loop stops HERE rather than being left to musicWanted(): that only
     stops the scheduler, and the scheduler works a lookahead ahead of the audio
     clock, so up to half a second of already committed notes would play on over
     the freeze. Then the sting, which is audible only because the music is
     gone. */
  silenceMusic();
  sfxDeathSting();
  // Deliberately unlike killEnemy(): no burst, no flash. The player's death is
  // a freeze frame, and anything still animating would contradict the world
  // having stopped. The ninja simply keeps being drawn in the pose he died in.
  // Clearing flash matters -- update() stops decaying it during the freeze, so
  // a flash left over from a kill would otherwise sit on screen for a second.
  flash = 0;
  bullets = []; hazards = [];
  sfxDeath();
}

// How grey the screen is right now, 0..1. Pure function of the death clock, so
// the sequence can be asserted without rendering anything.
function deathGrey() {
  if (mode === "gameover") return 1;      // the finished run stays desaturated
  if (mode !== "dying") return 0;
  const t = DEATH_TIME - dyingT;                        // elapsed
  if (t <= DEATH_HOLD) return 0;
  return Math.min(1, (t - DEATH_HOLD) / DEATH_FADE);
}

/* --- ENEMY AI ------------------------------------------------------------- */
/* CHARGER (type 1, rushes right-to-left)
     idle   -> player within CHG_AGGRO px and roughly level -> charge
     charge -> run left at CHG_SPEED; stops at a ledge rather than suiciding
            -> player within CHG_MELEE -> windup
     windup -> CHG_WINDUP telegraph (sword raised), frozen
     swing  -> CHG_SWING lethal hitbox in front, spans feet-40..feet-8 so a
               crouching player is still hit (crouch dodges bullets, not blades)
     recover-> CHG_RECOVER cooldown, then back to charge

   WARDEN (type 2, stationary ranged)
     idle   -> player within WARD_RANGE to the LEFT and level -> aim
     aim    -> WARD_AIM telegraph (gun extended)
     fire   -> one bullet left at BULLET_SPEED, at feet-BULLET_Y_OFF
     reload -> WARD_RELOAD ducked; cannot fire
   The bullet's height is the crouch mechanic: see fireBullet().             */

// 360 -> ~65px of rise: enough to clear a 2-tile block AND another 44px body.
// At 300 an enemy could not hop over a peer, which is how deadlocks formed.
const ENEMY_JUMP_VY = 360;

// Solid at the enemy's shin height in the direction it is walking.
function wallAhead(e, dir) {
  const px = dir > 0 ? e.x + e.w + 2 : e.x - 2;
  return solidAt(Math.floor(px / TILE), Math.floor((e.y + e.h - 3) / TILE));
}
// ...and open space above it, so hopping actually gets the enemy somewhere.
function clearAbove(e, dir) {
  const tx = Math.floor((dir > 0 ? e.x + e.w + 2 : e.x - 2) / TILE);
  const foot = Math.floor((e.y + e.h - 3) / TILE);
  return !solidAt(tx, foot - 2) && !solidAt(tx, foot - 3);
}
// Another live body directly ahead at the same footing. Enemies queueing behind
// one another was the actual deadlock: separation shoved an IDLE charger into a
// block, and everything behind it had nothing to do but press harder.
function bodyAhead(e, dir) {
  const probe = { x: dir > 0 ? e.x + e.w : e.x - 10, y: e.y, w: 10, h: e.h };
  for (const o of enemies) {
    if (o === e || !o.alive) continue;
    if (Math.abs((o.y + o.h) - (e.y + e.h)) > 8) continue;   // same footing only
    if (overlaps(probe, o)) return true;
  }
  return false;
}

// Is there room above the entity ITSELF to perform a jump? clearAbove() only
// checks above the obstacle, which let an enemy wedged under a low platform hop
// into its own ceiling and land again, forever, in a 4-frame limit cycle.
function headroom(e, tiles) {
  const tx0 = Math.floor(e.x / TILE), tx1 = Math.floor((e.x + e.w - 1) / TILE);
  const top = Math.floor(e.y / TILE);
  for (let k = 1; k <= tiles; k++) {
    for (let tx = tx0; tx <= tx1; tx++) if (solidAt(tx, top - k)) return false;
  }
  return true;
}

// Hop over terrain OR over a peer -- but only if the hop can actually go
// somewhere.
function hopIfBlocked(e, dir) {
  if (!e.onGround || !headroom(e, 2)) return;
  if ((wallAhead(e, dir) && clearAbove(e, dir)) || bodyAhead(e, dir)) {
    e.vy = -ENEMY_JUMP_VY;
  }
}

function ledgeAhead(e, dir) {
  const probeX = dir > 0 ? e.x + e.w + 2 : e.x - 2;
  return !solidAt(Math.floor(probeX / TILE), Math.floor((e.y + e.h + 2) / TILE));
}

// Is there floor a short way below the ledge? Distinguishing a step-down from a
// bottomless pit is the whole point: the old guard refused BOTH, which left
// enemies stranded on top of the very blocks they had just hopped onto.
function dropIsSafe(e, dir) {
  const tx = Math.floor((dir > 0 ? e.x + e.w + 2 : e.x - 2) / TILE);
  const from = Math.floor((e.y + e.h + 2) / TILE);
  for (let ty = from; ty <= from + 5 && ty < ROWS; ty++) if (solidAt(tx, ty)) return true;
  return false;
}
// Only a true pit should stop a walker.
function pitAhead(e, dir) {
  return ledgeAhead(e, dir) && !dropIsSafe(e, dir);
}

/* --- CROSSING GAPS --------------------------------------------------------
   Walking into a pit and hopping blind were both symptoms of the same thing:
   each state machine handled pits on its own. Chargers simply stopped dead at
   every gap and never crossed one; rushers hopped at any gap regardless of
   whether the hop could reach the far side, so they dropped into the wide
   stepping-stone gap in segment 5.

   Both halves now live here. A walker measures the gap, and either commits to a
   leap that is known to clear it or holds at the edge. Nothing falls in by
   walking, and everything crosses what it can.                              */

const ENEMY_LEAP_VX = 150;      // horizontal push while airborne over a gap

// One leap's horizontal reach, derived from the jump itself rather than tuned
// by hand, so changing ENEMY_JUMP_VY cannot silently invalidate the decision.
const ENEMY_HOP_RISE = (ENEMY_JUMP_VY * ENEMY_JUMP_VY) / (2 * GRAVITY_RISE);
const ENEMY_HOP_AIR = ENEMY_JUMP_VY / GRAVITY_RISE
                    + Math.sqrt(2 * ENEMY_HOP_RISE / GRAVITY_FALL);
const ENEMY_HOP_REACH = ENEMY_HOP_AIR * ENEMY_LEAP_VX;
const GAP_MARGIN = 10;          // px of slack required before committing


// Width in pixels of the missing floor ahead at this entity's own footing.
// 0 means the floor continues, counting a short step down as walkable -- the
// same tolerance dropIsSafe() uses, so a ledge is not mistaken for a pit.
function gapWidthAhead(e, dir) {
  const foot = Math.floor((e.y + e.h + 2) / TILE);
  const edge = dir > 0 ? Math.floor((e.x + e.w) / TILE)
                       : Math.floor((e.x - 1) / TILE);
  for (let k = 0; k < 10; k++) {
    const c = edge + dir * k;
    if (c < 0 || c >= COLS) return 0;              // the world edge is a wall
    for (let r = foot; r <= foot + 5 && r < ROWS; r++) {
      if (solidAt(c, r)) return k * TILE;
    }
  }
  return 99 * TILE;                                // wider than any leap
}

function commitLeap(e, dir) {
  e.vy = -ENEMY_JUMP_VY;
  e.vx = dir * ENEMY_LEAP_VX;
  e.leapT = ENEMY_HOP_AIR;
  e.leapDir = dir;
}

// Commit to a leap, or hold at the edge. Returns true when a gap was handled.
function handleGap(e, dir) {
  const gap = gapWidthAhead(e, dir);
  if (gap <= 0) return false;
  if (gap + GAP_MARGIN <= ENEMY_HOP_REACH) {
    commitLeap(e, dir);
  } else {
    // Wider than one leap. Holding at the lip is the whole point: a body that
    // commits to a gap it cannot clear is a body in the pit. Segment 5's
    // five-tile chasm is the only one on the stage that lands here, and the
    // player crosses it on stepping stones the AI does not read.
    e.vx = 0;
  }
  return true;
}

// While it cannot attack -- reloading, or recovering from a swing -- the warden
// gives ground if you have closed in, so standing on top of it is not a free
// kill. Bounded against its post, or it could be walked across the stage.
function wardenGiveGround(e, dx) {
  if (dx < 0 && Math.abs(dx) < WARD_BACKSTEP_RANGE &&
      (e.x + e.w / 2) - e.homeX < WARD_BACKSTEP_MAX) {
    e.vx = WARD_BACKSTEP_SPEED;
  }
}

// Bullets fly at feet-36. The crouch hitbox tops out at feet-30, so a ducking
// ninja passes under the shot by 6px; standing, it lands inside his torso.
// Measured from the FEET so it holds regardless of sprite height.
function fireBullet(e) {
  const feet = e.y + e.h;
  bullets.push({
    x: e.x - BULLET_W, y: feet - BULLET_Y_OFF,
    w: BULLET_W, h: BULLET_H, vx: -BULLET_SPEED
  });
}

// Keep bodies from occupying the same space. Enemies split the overlap between
// them; against the player only the ENEMY yields, so separation can never fight
// the player's own input.
/* CROWDING: THEY PASS THROUGH EACH OTHER.

   This used to resolve every overlapping pair by pushing both bodies apart --
   two passes of it, because one pass leaves a stack. With twenty-eight enemies
   that read as jostling; with fifty-six it reads as a scrum. The shove is
   positional, so it fights whatever the AI decided that frame: a charger walks
   forward, gets pushed back, walks forward again. The bodies visibly vibrate.

   Enemies now simply walk through one another. Nothing pushes anything, which
   means nothing can fight the AI, which means a crowd resolves itself by
   walking rather than by shoving.

   Two things keep that from looking like one body wearing another:

   - A SPEED CONCESSION. When two bodies are deeply overlapped the one BEHIND
     eases off a little, so the pair slides apart over a few frames instead of
     travelling locked together. It is a change of speed, not of position, so
     it cannot contradict the AI -- it just takes slightly longer to arrive.
   - The standoff offset already on `homeX`, which stops pursuers converging on
     one point in the first place.

   The player is still pushed out of a body, because walking into one is meant
   to have weight -- that is bumpNinja's job, and this is the positional half of
   it. It stops at the leash so the player cannot bulldoze an enemy across the
   stage.                                                                     */
const CROWD_DEEP = 0.55;        // fraction of a body width that counts as deep
const CROWD_YIELD = 0.35;       // how much of its speed the trailing one keeps

/* Sets e.crowd, the factor its velocity is integrated through this frame. It
   runs BEFORE the enemy updates and is applied at the integration, because
   updateEnemy() rewrites e.vx from scratch every frame -- scaling vx after the
   bodies had already moved, which is where this started, was a no-op. */
function crowdYield() {
  const live = enemies.filter(e => e.alive);
  for (const e of live) e.crowd = 1;
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      // Bodies at clearly different heights -- one mid-leap, one vaulting in --
      // are not crowding each other at all.
      if (Math.abs((a.y + a.h) - (b.y + b.h)) > 24) continue;
      if (!overlaps(a, b)) continue;
      const aMid = a.x + a.w / 2, bMid = b.x + b.w / 2;
      const gap = (a.w + b.w) / 2 - Math.abs(aMid - bMid);
      if (gap < a.w * CROWD_DEEP) continue;         // brushing past is fine
      /* The one travelling INTO the other eases off: whichever is behind, in
         its own direction of travel, yields.

         Exactly co-located bodies need the tie broken by hand. Math.sign(0) is
         0, so neither counts as behind the other, neither yields, and the pair
         travels locked together for good -- with the positional shove gone
         there is nothing else to prise them apart. The tie goes to list order,
         which is stable, so a pair always resolves and always the same way. */
      if (aMid === bMid) {
        a.crowd = CROWD_YIELD;
      } else {
        for (const [me, other] of [[a, b], [b, a]]) {
          const toward = Math.sign((other.x + other.w / 2) - (me.x + me.w / 2));
          if (Math.sign(me.vx) === toward) me.crowd = CROWD_YIELD;
        }
      }
    }
  }
}

// Only the player is pushed out of a body now; bodies pass through each other.
function separateBodies() {
  const live = enemies.filter(e => e.alive);
  for (const e of live) {
    if (!overlaps(e, ninja)) continue;
    const gap = (e.w + ninja.w) / 2 - Math.abs((e.x + e.w / 2) - (ninja.x + ninja.w / 2));
    if (gap <= 0) continue;
    const dir = e.x < ninja.x ? -1 : 1;
    // Stop shoving once the body is at its leash. Otherwise the player simply
    // bulldozes an enemy across the whole stage, keeping it permanently in his
    // face -- the opposite of "enemies should pass by or disappear". Past the
    // boundary the player walks THROUGH it instead, which is harmless anyway.
    if (Math.abs(e.x + e.w / 2 + dir * gap - e.homeX) > CHG_LEASH) continue;
    moveX(e, dir * gap);
  }
}


function enemyAwake() { return wakeT <= 0; }

function updateEnemy(e, dt) {
  const nMidX = ninja.x + ninja.w / 2, eMidX = e.x + e.w / 2;
  const dx = nMidX - eMidX;
  const dyFeet = (ninja.y + ninja.h) - (e.y + e.h);
  e.facing = dx > 0 ? 1 : -1;

  /* Nothing engages during the opening grace. Held in its resting state rather
     than skipped outright, so gravity and the ground still apply and a body
     does not hang in the air waiting for the clock. Only the resting and
     approach states are held: an enemy already mid-attack is left to finish,
     because interrupting a swing that has a live hitbox in the world would
     strand the hitbox. */
  if (!enemyAwake() && (e.state === "idle" || e.state === "wait" ||
                        e.state === "charge")) {
    e.vx = 0;
    e.state = e.kind === "rusher" ? "wait" : "idle";
    return;
  }

  /* THE PERCH runs ahead of every per-kind state machine and returns, so a
     sentry on a roof cannot be walking the approach states of its kind while it
     is supposed to be standing still forty pixels in the air. It is cleared for
     good on landing -- `ledge` false -- and the body drops into its kind's
     normal opening state, so one enemy is a sentry once and an ordinary enemy
     for the rest of its life. */
  if (e.ledge) {
    switch (e.state) {
      case "perch": {
        e.vx = 0;
        // It looks the way the player will come from, not at them: turning to
        // track someone still out of range gives the ambush away.
        e.facing = -1;
        // Committing needs the player inside the strip AND genuinely below --
        // someone standing on the same roof is a fight, not a dive.
        if (Math.abs(dx) <= PERCH_SCAN && dyFeet > ENEMY_H * 0.5) {
          e.state = "perchWind"; e.timer = PERCH_WIND;
          e.diveDir = dx > 0 ? 1 : -1;
        }
        break;
      }
      case "perchWind":
        // The crouch. Still harmless, and the only warning there is.
        e.vx = 0;
        e.facing = e.diveDir;
        if ((e.timer -= dt) <= 0) {
          e.state = "dive";
          e.vx = e.diveDir * PERCH_DIVE_VX;
          e.vy = PERCH_DIVE_VY;
          e.onGround = false;
        }
        break;
      case "dive":
        /* Falling with the weapon leading. Lethal for the whole descent, which
           is the point of it, and the box is pushed fresh every frame so it
           tracks the body down instead of hanging where the drop started. */
        e.facing = e.diveDir;
        leadHazard(e, PERCH_HIT_W, PERCH_HIT_TOP, PERCH_HIT_BOT);
        if (e.onGround) {
          e.state = "perchLand"; e.timer = PERCH_LAND; e.vx = 0;
          spawnBurst(e.x + e.w / 2, e.y + e.h, 7,
                     ["#C8C2B4", "#9A948A", "#6E6A60"], 90, 0.28);
        }
        break;
      case "perchLand":
        // The recovery the drop is paid for with. Vulnerable, not dangerous.
        e.vx = 0;
        if ((e.timer -= dt) <= 0) {
          e.ledge = false;                  // from here it is just an enemy
          e.state = e.kind === "rusher" ? "run" : e.kind === "charger" ? "charge" : "idle";
          e.leaps = 0; e.timer = 0;
        }
        break;
      default:
        // Any other state on a perched body is a bug elsewhere; park it.
        e.state = "perch"; e.vx = 0;
        break;
    }
    // Gravity and the ground still apply -- only "perch" and "perchWind" hold
    // position, and they hold it by standing on the ledge like anything else.
    if (e.state === "dive") {
      e.vy = Math.min(e.vy + GRAVITY_FALL * 0.45 * dt, MAX_FALL);
      moveEntity(e, e.vx * dt, e.vy * dt);
      e.onGround = probeGround(e);
    } else {
      e.vy = Math.min(e.vy + GRAVITY_FALL * dt, MAX_FALL);
      moveEntity(e, 0, e.vy * dt);
      e.onGround = probeGround(e);
    }
    return;
  }

  if (e.kind === "rusher") {
    // Does not wait to be provoked: the moment it is on screen it commits,
    // which is what makes it read as "incoming from the right".
    switch (e.state) {
      case "peek": {
        /* Watching over the coping. Glued to the wall line rather than falling,
           because the wall is a screen-space parallax layer -- a world-space
           y would slide off it the moment the camera moved vertically. */
        e.vx = 0; e.vy = 0;
        const bob = Math.sin(clock * 3.4) > 0 ? 1 : 0;   // shifts its weight
        e.y = cam.y + WALL_TOP - VAULT_REVEAL + bob;
        e.facing = e.vaultDir;
        if ((e.timer -= dt) <= 0) { e.state = "climb"; e.timer = VAULT_CLIMB; }
        return;                       // no physics: it is holding onto a wall
      }
      case "climb": {
        // Rising until the whole body is clear of the coping.
        e.vx = 0; e.vy = 0;
        const u = 1 - Math.max(0, e.timer) / VAULT_CLIMB;
        const from = cam.y + WALL_TOP - VAULT_REVEAL;
        const to = cam.y + WALL_TOP - ENEMY_H;
        e.y = from + (to - from) * u;
        e.facing = e.vaultDir;
        if ((e.timer -= dt) <= 0) {
          // Over the top: push off, and from here it is an ordinary falling
          // body under the vault's own gentle gravity.
          e.state = "vault";
          e.vx = e.vaultDir * VAULT_VX;
          e.vy = 0;
        }
        return;
      }
      case "vault":
        // Dropping into the alley. Keeps its drift, spawns no hitbox, and
        // cannot be hit -- moveY() puts it on the ground and ends the state.
        if (e.onGround) { e.state = "vaultLand"; e.timer = VAULT_RECOVER; e.vx = 0; }
        break;
      case "vaultLand":
        // The landing beat. Vulnerable from here, but not yet dangerous: this
        // is the window the player gets in exchange for the entrance.
        e.vx = 0;
        if ((e.timer -= dt) <= 0) { e.state = "run"; e.leaps = 0; }
        break;
      case "wait":
        e.vx = 0;
        if (e.x < cam.x + VIEW_W - 4) e.state = "run";
        break;
      case "run":
        // A PASS, not a pursuit. It always travels left: one attack on the way
        // through, then it exits stage-left and despawns. Chasing made them
        // gather on the player and spike the difficulty without bound.
        e.vx = -RUSH_SPEED;
        e.facing = -1;
        hopIfBlocked(e, -1);
        // Up to RUSH_MAX_LEAPS per pass, each one weaker, then it moves on.
        if (e.onGround && e.leaps < RUSH_MAX_LEAPS && dx < 0 &&
            Math.abs(dx) <= RUSH_LEAP_RANGE && Math.abs(dyFeet) <= 48) {
          e.state = "leap"; e.timer = RUSH_LEAP_TIME;
          e.vy = -RUSH_LEAP_VY * Math.pow(RUSH_LEAP_DECAY, e.leaps);
          e.leaps++;
        }
        break;
      case "leap":
        e.vx = -RUSH_SPEED * 1.3;        // the leap carries it onward, leftward
        // Daggers out in front for the whole descent; the body is inert.
        leadHazard(e, LEAP_HIT_W, LEAP_HIT_TOP, LEAP_HIT_BOT);
        e.timer -= dt;
        if (e.onGround && e.timer < RUSH_LEAP_TIME - 0.2) {
          e.state = "recover"; e.timer = 0.35; e.lethal = false;
        }
        break;
      case "recover":
        e.vx = 0;
        if ((e.timer -= dt) <= 0) e.state = "run";
        break;
    }
  } else if (e.kind === "charger") {
    switch (e.state) {
      case "idle":
        e.vx = 0;
        // If something has wedged us against terrain, walk out of it rather
        // than standing there as an immovable wall for everyone behind.
        if (bodyAhead(e, 1) && wallAhead(e, -1)) { e.vx = 0; hopIfBlocked(e, -1); }
        if (Math.abs(dx) <= CHG_AGGRO && Math.abs(dyFeet) <= CHG_DY) e.state = "charge";
        break;
      case "charge": {
        const dir = Math.sign(dx) || -1;
        /* A POSTED charger does not advance. It swings when you come inside its
           reach and otherwise stands where it was placed -- so it has to be got
           PAST rather than outrun, which the roster had nothing of outside the
           warden, and it can never shove another body into a jam. */
        if (e.post) {
          e.vx = 0;
          if (Math.abs(dx) <= CHG_MELEE && Math.abs(dyFeet) <= CHG_DY) {
            e.state = "windup"; e.timer = CHG_WINDUP;
          }
          break;
        }
        hopIfBlocked(e, dir);
        // Clamp at the leash boundary rather than flipping to idle there --
        // flipping would oscillate every frame on the edge.
        const wouldBe = e.x + e.w / 2 + dir * CHG_SPEED * dt;
        const leashed = Math.abs(wouldBe - e.homeX) > CHG_LEASH;
        // Walk off ordinary ledges; halt only at a genuine bottomless pit.
        e.vx = leashed ? 0 : dir * CHG_SPEED;
        if (Math.abs(dx) <= CHG_MELEE) { e.state = "windup"; e.timer = CHG_WINDUP; e.vx = 0; }
        // Mid range and off cooldown: close the gap with a lunge instead of a
        // walk, which is what stops "stand just outside its reach" working.
        else if (e.lungeCd <= 0 && e.onGround &&
                 Math.abs(dx) >= CHG_LUNGE_MIN && Math.abs(dx) <= CHG_LUNGE_RANGE &&
                 Math.abs(dyFeet) <= CHG_DY &&
                 // Refuse a lunge that would carry it past its post. The dash
                 // is fast enough to clear the leash outright, and the leash is
                 // the only thing keeping a charger from being walked away.
                 Math.abs(eMidX + dir * CHG_LUNGE_DIST - e.homeX) <= CHG_LEASH) {
          e.state = "lungeWind"; e.timer = CHG_LUNGE_WIND; e.vx = 0;
          e.lungeDir = dir;
        }
        else if (Math.abs(dx) > CHG_AGGRO * 1.4) e.state = "idle";
        break;
      }
      case "lungeWind":
        e.vx = 0;                       // frozen: the telegraph is the fairness
        if ((e.timer -= dt) <= 0) {
          e.state = "lunge"; e.timer = CHG_LUNGE_TIME;
        }
        break;
      case "lunge": {
        // Cut the dash short at the leash rather than only refusing to start
        // one: terrain can shorten a dash, and separation can shove a body
        // outward mid-flight.
        const past = Math.abs(eMidX - e.homeX) > CHG_LEASH;
        e.vx = past ? 0 : e.lungeDir * CHG_LUNGE_SPEED;
        // The sword is levelled ahead of the dash -- which is exactly what the
        // lunge POSE has always drawn -- so that is where the hitbox goes.
        if (!past) leadHazard(e, LUNGE_HIT_W, LUNGE_HIT_TOP, LUNGE_HIT_BOT);
        if (past || (e.timer -= dt) <= 0) {
          e.state = "recover"; e.timer = CHG_RECOVER;
          e.lungeCd = CHG_LUNGE_CD;
        }
        break;
      }
      case "windup":
        e.vx = 0;
        if ((e.timer -= dt) <= 0) {
          e.state = "swing"; e.timer = CHG_SWING;
          const feet = e.y + e.h;
          hazards.push({
            x: e.facing > 0 ? e.x + e.w : e.x - CHG_HIT_W,
            y: feet - CHG_HIT_TOP, w: CHG_HIT_W, h: CHG_HIT_TOP - CHG_HIT_BOT,
            ttl: CHG_SWING
          });
        }
        break;
      case "swing":
        e.vx = 0;
        if ((e.timer -= dt) <= 0) { e.state = "recover"; e.timer = CHG_RECOVER; }
        break;
      case "recover":
        e.vx = 0;
        if ((e.timer -= dt) <= 0) e.state = "charge";
        break;
    }
  } else {
    e.vx = 0;
    switch (e.state) {
      case "idle":
        // Only engages a player on its left -- it is facing the way you came.
        if (dx < 0 && Math.abs(dyFeet) <= WARD_DY) {
          if (Math.abs(dx) <= WARD_SWEEP_RANGE) {
            e.state = "sweepWind"; e.timer = WARD_SWEEP_WIND;
          } else if (Math.abs(dx) <= WARD_RANGE) {
            e.state = "aim"; e.timer = WARD_AIM;
            // One thrown slash at distance, a burst of them once you are close.
            e.shots = Math.abs(dx) <= WARD_BURST_RANGE ? WARD_BURST_SHOTS : 1;
          }
        }
        break;
      case "sweepWind":
        // Frozen through the windup: the telegraph is what makes the reach fair.
        if ((e.timer -= dt) <= 0) {
          e.state = "sweep"; e.timer = WARD_SWEEP_TIME;
          const feet = e.y + e.h;
          hazards.push({
            x: e.facing > 0 ? e.x + e.w : e.x - WARD_SWEEP_REACH,
            y: feet - WARD_SWEEP_TOP,
            w: WARD_SWEEP_REACH, h: WARD_SWEEP_TOP - WARD_SWEEP_BOT,
            ttl: WARD_SWEEP_TIME
          });
        }
        break;
      case "sweep":
        if ((e.timer -= dt) <= 0) { e.state = "recover"; e.timer = WARD_SWEEP_RECOVER; }
        break;
      case "recover":
        // The opening: a long enough tail that stepping in after a swing works.
        wardenGiveGround(e, dx);
        if ((e.timer -= dt) <= 0) e.state = "idle";
        break;
      case "aim":
        if ((e.timer -= dt) <= 0) {
          fireBullet(e);
          if (--e.shots > 0) { e.state = "burst"; e.timer = WARD_BURST_GAP; }
          else { e.state = "reload"; e.timer = WARD_RELOAD; }
        }
        break;
      case "burst":
        // Follow-up rounds come fast, so one crouch has to cover all of them.
        if ((e.timer -= dt) <= 0) {
          fireBullet(e);
          if (--e.shots > 0) e.timer = WARD_BURST_GAP;
          else { e.state = "reload"; e.timer = WARD_RELOAD; }
        }
        break;
      case "reload":
        wardenGiveGround(e, dx);
        if ((e.timer -= dt) <= 0) e.state = "idle";
        break;
    }
  }

  // Gap handling sits outside the per-kind state machines so chargers, rushers
  // and wave spawns all behave the same way at an edge. A committed leap owns
  // the horizontal speed for its duration, or the state machine would zero it
  // mid-air and drop the body straight down the hole.
  if (e.leapT > 0) {
    if (e.onGround && e.vy >= 0) e.leapT = 0;      // landed: hand speed back
    else { e.leapT -= dt; e.vx = e.leapDir * ENEMY_LEAP_VX; }
  }
  // Negated rather than `e.leapT <= 0`: an entity built without the field would
  // compare undefined <= 0 as false and silently lose gap handling entirely.
  if (!(e.leapT > 0) && e.onGround && Math.abs(e.vx) > 1) {
    handleGap(e, Math.sign(e.vx));
  }

  if (e.lungeCd > 0) e.lungeCd -= dt;

  const wantVx = e.vx;        // captured before moveX can zero it on contact
  /* Rise gravity for rushers so their leap arc reads clearly -- and a vaulter
     mid-descent gets its own, far gentler, because the descent is the whole
     event and the player's gravity finishes it before anyone can look up. */
  const eg = vaultAirborne(e) ? VAULT_GRAVITY
           : (e.vy < 0 ? GRAVITY_RISE : GRAVITY_FALL);
  e.vy = Math.min(e.vy + eg * dt, MAX_FALL);
  // e.crowd is this frame's crowding concession -- see crowdYield().
  moveEntity(e, e.vx * (e.crowd === undefined ? 1 : e.crowd) * dt, e.vy * dt);
  e.onGround = probeGround(e);
  if (e.onGround) e.vy = 0;
  e.animTime += dt;

  // Catch-all anti-jam. Measured against the INTENDED velocity, because moveX
  // zeroes e.vx the instant it touches a wall -- so the old `|e.vx| > 1` test
  // could never fire for the very entities that were stuck against one.
  if (Math.abs(wantVx) > 1 && Math.abs(e.x - e.lastX) < 0.4) {
    e.stuckT += dt;
    if (e.stuckT > 0.8) {
      e.stuckT = 0;
      if (e.onGround && headroom(e, 2)) e.vy = -ENEMY_JUMP_VY;
      // Nowhere to go at all. A pass-through runner leaves the stage rather than
      // vibrating against the geometry for the rest of the level. The stage
      // validators make this unreachable on the shipped map; it stays as a
      // safety net, so it withdraws in a puff of smoke instead of blinking out
      // of existence the way it used to. No kill credit: nobody earned it.
      else if (e.kind === "rusher") {
        e.alive = false; e.dying = 0.35; e.lethal = false;
        spawnBurst(e.x + e.w / 2, e.y + e.h / 2, 8,
                   ["#6B7280", "#9AA3B2", "#4B5563"], 70, 0.35);
      }
    }
  } else e.stuckT = 0;
  // Same distance-driven gait as the ninja. Signed against the direction it
  // MEANT to travel (wantVx, captured before moveX could zero it), so a body
  // jammed against geometry reads as standing rather than sprinting in place.
  const intent = Math.sign(wantVx) || Math.sign(e.vx);
  trackWalk(e, intent ? (e.x - e.lastX) * intent : 0, dt);
  e.lastX = e.x;

  // The camera never rewinds, so ANY body left behind it is unreachable.
  // The second clause matters at the very start of the stage: with cam.x at 0
  // there is no space left of the view, so a runner jams against the world wall
  // and would otherwise stand there forever.
  const offLeft = e.x + e.w < cam.x - 8;
  const wedgedAtEdge = e.x <= 2 && e.x + e.w < ninja.x;
  if (offLeft || wedgedAtEdge) { e.alive = false; e.dying = 0; e.lethal = false; }

  // Backstop only. handleGap() means nothing walks into a pit any more, but an
  // attack leap aimed across one can still come up short, and a body with no
  // floor under it must not fall forever. No kill credit: nobody earned it.
  if (e.y > WORLD_H + 64) { e.alive = false; e.dying = 0; e.lethal = false; }
}

/* --- UPDATE --------------------------------------------------------------- */

function update(dt) {
  // The death freeze is checked FIRST and advances nothing but its own clock.
  // clock and particles used to be updated above this branch, which is why
  // the old death still had a living background behind the burst.
  if (mode === "dying") {
    if ((dyingT -= dt) <= 0) {
      if (lives > 0) { respawn(); mode = "play"; }
      // Last life: stay frozen and grey, and roll the run's summary.
      else { mode = "gameover"; gameOverT = GAMEOVER_TIME; recordRun(); }
    }
    return;
  }
  // Game over holds the grey freeze frame. The clock runs so the prompt blinks;
  // nothing else does.
  if (mode === "gameover") {
    clock += dt;
    gameOverT = Math.max(0, gameOverT - dt);
    if (gameOverT <= 0) toTitle();
    return;
  }
  // A pause is an absolute stop -- not even the background moves, so the frame
  // you paused on is the frame you come back to.
  if (mode === "paused") return;
  // The title screen is the opposite: nothing simulates, but the clock runs so
  // the alley behind the logo is alive and the ninja keeps breathing.
  if (mode === "title") { clock += dt; return; }
  clock += dt;      // keeps the alley alive even while standing still
  updateParticles(dt);
  if (mode === "clear") { flash = Math.max(0, flash - dt); return; }
  // Counted before the hitstop check, because those frames are still your run.
  // It stops at the ending and while paused, and respawn() puts it back to
  // zero: the clock times the current LIFE, not the whole session.
  playTime += dt;
  stageTotal += dt;
  // Hitstop: freeze the world for a few frames so a kill lands.
  /* Hitstop freezes the shake too, deliberately. The held frame is what the
     hit IS; letting the camera keep moving through it turns the freeze into a
     stutter. The shove is therefore still on screen, held, and the decay picks
     up the moment the world starts again. */
  if (hitFreeze > 0) { hitFreeze -= dt; flash = Math.max(0, flash - dt); return; }
  updateShake(dt);

  // The dash puts the body on rails: while it runs, acceleration, friction,
  // gravity and the crouch are all suspended, and every other system -- enemy
  // ticks, hazards, pickups -- keeps running exactly as before.
  ninja.dashCd = Math.max(0, ninja.dashCd - dt);
  if (ninja.onGround) ninja.airDashes = 0;
  const dashing = ninja.dashT > 0;
  if (dashing) {
    ninja.dashT = Math.max(0, ninja.dashT - dt);
    ninja.ghostT -= dt;
    if (ninja.ghostT <= 0) { pushGhost(); ninja.ghostT = GHOST_GAP; }
  }
  updateGhosts(dt);

  const dir = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
  if (dir !== 0 && !dashing) ninja.facing = dir;
  setCrouch(!dashing && keys.has("ArrowDown") && ninja.onGround);
  const topSpeed = ninja.crouch ? CROUCH_SPEED : MOVE_SPEED;

  if (dashing) {
    ninja.vx = ninja.dashDir * DASH_SPEED;
  } else if (dir !== 0) {
    const turning = ninja.vx !== 0 && Math.sign(ninja.vx) !== dir;
    let a = ninja.onGround ? ACCEL_GROUND : ACCEL_AIR;
    if (turning) a *= TURN_BOOST;
    ninja.vx += dir * a * dt;
    if (Math.abs(ninja.vx) > topSpeed) ninja.vx = dir * topSpeed;
  } else {
    // Coast to a stop, snapping to zero inside one frame's friction so vx never
    // lingers as a float epsilon that keeps the run animation twitching.
    const f = (ninja.onGround ? FRICTION_GROUND : FRICTION_AIR) * dt;
    if (Math.abs(ninja.vx) <= f) ninja.vx = 0;
    else ninja.vx -= Math.sign(ninja.vx) * f;
  }
  // The dash's own speed is above the walking cap, so the cap is not applied
  // to it -- clamping here is what would turn the dash back into a walk.
  if (!dashing && Math.abs(ninja.vx) > topSpeed) ninja.vx = Math.sign(ninja.vx) * topSpeed;

  ninja.coyote = ninja.onGround ? COYOTE_TIME : Math.max(0, ninja.coyote - dt);
  ninja.buffer = Math.max(0, ninja.buffer - dt);
  if (ninja.buffer > 0 && ninja.coyote > 0 && !ninja.crouch) {
    ninja.vy = -JUMP_VEL; ninja.buffer = 0; ninja.coyote = 0; ninja.onGround = false;
    // A jump CANCELS a dash rather than being swallowed by it, and it keeps the
    // dash's horizontal speed for that frame -- the dash-jump is the reward for
    // chaining them, and the thing that makes the pair worth learning.
    ninja.dashT = 0;
  }

  // Gravity off for the duration: a dash that arcs is a jump, and the flat
  // line is the whole read.
  const g = ninja.dashT > 0 ? 0 : ninja.vy < 0 ? GRAVITY_RISE : GRAVITY_FALL;
  if (ninja.dashT > 0) ninja.vy = 0;
  else ninja.vy = Math.min(ninja.vy + g * dt, MAX_FALL);

  const wasAirborne = !ninja.onGround;
  const impactVy = ninja.vy;
  const beforeX = ninja.x;
  moveEntity(ninja, ninja.vx * dt, ninja.vy * dt);
  ninja.onGround = probeGround(ninja);
  // A dash into a wall ends there rather than grinding against it for the rest
  // of its duration, which both looks stuck and eats the cooldown for nothing.
  if (ninja.dashT > 0 && Math.abs(ninja.x - beforeX) < Math.abs(ninja.vx) * dt * 0.4) {
    ninja.dashT = 0;
  }
  // Ground actually covered this frame drives the walk cycle.
  trackWalk(ninja, (ninja.x - beforeX) * (ninja.facing < 0 ? -1 : 1), dt);
  // The screen's left edge is a wall: the camera never rewinds, so the ninja
  // cannot be allowed to walk out of the viewport behind it.
  if (ninja.x < cam.x) { ninja.x = cam.x; if (ninja.vx < 0) ninja.vx = 0; }
  if (wasAirborne && ninja.onGround && impactVy >= LAND_VY) {
    ninja.landTimer = LAND_TIME;
    /* A hard landing is an impact and was silent. Scaled by how fast he was
       going, so stepping off a cover block is not the same event as falling the
       height of the alley -- one kick of dust, one for the full drop. */
    const f = Math.min(1, (impactVy - LAND_VY) / (MAX_FALL - LAND_VY));
    addTrauma(TRAUMA_LAND * (0.45 + f));
    spawnBurst(ninja.x + ninja.w / 2, ninja.y + ninja.h - 1,
               2 + Math.round(f * 4), ["#B6AC9A", "#8E8676", "#6A6458"],
               50 + f * 60, 0.22);
  }

  if (ninja.y > WORLD_H + 64) { killNinja(); return; }

  waveTimer -= dt;
  if (waveTimer <= 0) { spawnWaveRusher(); waveTimer = WAVE_INTERVAL; }
  pumpVaults();
  crowdYield();            // before the bodies move, not after

  for (const e of enemies) {
    if (!e.alive) {
      e.dying = Math.max(0, e.dying - dt);
      e.impact = Math.max(0, (e.impact || 0) - dt);
      continue;
    }
    // A vaulter mid-air is always ticked: it is fired ahead of the camera on
    // purpose, and skipping it would leave it hanging in the sky until the
    // camera caught up, at which point it would drop with no warning at all.
    if (!vaultAirborne(e) &&
        (e.x + e.w < cam.x - ACTIVE_MARGIN ||
         e.x > cam.x + VIEW_W + ACTIVE_MARGIN)) continue;
    updateEnemy(e, dt);
  }

  for (const s of shurikens) {
    s.x += s.vx * dt; s.spin += dt;
    if (blockedAt(s.x, s.y, s.w, s.h)) {
      s.dead = true;
      spawnBurst(s.x + s.w / 2, s.y + s.h / 2, 5, ["#FFE45E", "#FFFFFF"], 90, 0.22);
    }
    if (s.x > cam.x + VIEW_W + 32 || s.x + s.w < cam.x - 32) s.dead = true;
    for (const e of enemies) {
      // A vaulter in the air is untouchable: otherwise the answer to a
      // silhouette falling out of the sky is to stand still and throw at it,
      // and the entrance becomes a free kill instead of something to react to.
      if (e.alive && !vaultAirborne(e) && overlaps(s, e)) {
        killEnemy(e); s.dead = true;
      }
    }
  }
  shurikens = shurikens.filter(s => !s.dead);

  for (const b of bullets) {
    b.x += b.vx * dt;
    if (blockedAt(b.x, b.y, b.w, b.h)) b.dead = true;
    if (b.x + b.w < cam.x - 32) b.dead = true;
    // Bullets are attacks too, and they are resolved before any body contact
    // for the same reason the hazard boxes are.
    if (!b.dead && overlaps(b, ninja)) { b.dead = true; killNinja(); return; }
  }
  bullets = bullets.filter(b => !b.dead);

  // Player melee: instant, no travel time, and it does not spend ammunition.
  for (const sl of slashes) {
    // The box follows the body, keeping the direction it was thrown in. An
    // enemy's dash hazard is refreshed the same way and for the same reason:
    // a box left where the attack STARTED is not where the weapon is.
    const slFeet = ninja.y + ninja.h;
    sl.x = sl.dir > 0 ? ninja.x + ninja.w - 2 : ninja.x - sl.w + 2;
    sl.y = slFeet - SLASH_TOP;
    // Still drawing the blade: the box does not exist yet.
    if (sl.wind > 0) { sl.wind -= dt; continue; }
    sl.ttl -= dt;
    if (sl.ttl <= 0) continue;
    let cut = 0;
    for (const e of enemies) {
      // Silenced, then one cue for the whole arc rather than one per body --
      // the same reason a multi-kill suppresses them. The DEATH is identical to a
      // shuriken kill (same killEnemy, same burst, same hitstop); only the
      // sound tells you which weapon did it.
      if (e.alive && !vaultAirborne(e) && overlaps(sl, e)) {
        killEnemy(e, true); cut++;
      }
    }
    if (cut > 0 && !sl.hit) { sl.hit = true; sfxBladeKill(); }
  }
  slashes = slashes.filter(sl => sl.wind > 0 || sl.ttl > 0);

  /* ATTACKS RESOLVE BEFORE COLLISIONS, and the ordering is deliberate rather
     than incidental.

     An enemy that is attacking you is also, almost always, touching you: a
     charger's swing box overlaps the body it swung from, and a rusher's dive
     puts its daggers exactly where its chest is. So on a frame where both land,
     something has to win. It has to be the attack -- being bounced off a body
     you were simultaneously killed by is not a lesser outcome, it is the wrong
     one, and it would also play the bump's thud over the death.

     Nothing kills by body contact. Every death comes from a bullet, a hazard
     box, or a pit, so `e.lethal` survives only as a read-only flag for the
     debug overlay and the pose picker and is never tested against the player. */
  let struck = false;
  for (const h of hazards) {
    h.ttl -= dt;
    if (!struck && h.ttl > 0 && overlaps(h, ninja)) struck = true;
  }
  hazards = hazards.filter(h => h.ttl > 0);
  if (struck) { killNinja(); return; }

  /* Only now, and only if nothing landed, does walking into a body shove you.
     A vaulter in the air is passed through entirely -- a body dropping from off
     screen that shoves you is a hazard you could not see coming, which is the
     one kind of difficulty this stage's whole design avoids. */
  for (const e of enemies) {
    if (e.alive && !vaultAirborne(e) && overlaps(e, ninja)) { bumpNinja(e); break; }
  }

  separateBodies();

  // Retire spent wave spawns so the list cannot grow without bound.
  // Both kinds of transient: wave spawns and vaulters.
  enemies = enemies.filter(e => !((e.wave || e.vault) && !e.alive && e.dying <= 0));

  for (const p of pickups) {
    if (!p.taken && overlaps(p, ninja)) {
      p.taken = true;
      // Ammunition, capped at what you can carry. It used to raise a permanent
      // cap on how many could be airborne at once, which is why the stage only
      // needed two of these; it now tops up a stock that gets spent, so there
      // are six and they are worth three each.
      shurikenAmmo = Math.min(SHURIKEN_MAX, shurikenAmmo + SHURIKEN_PICKUP);
      score += SCORE_PICKUP;
      sfxPickup();
    }
  }

  for (const f of flags) {
    if (!f.taken && overlaps(f, ninja)) {
      f.taken = true; flagsTaken++;
      score += SCORE_FLAG;
      flash = 0.16; flashCol = "255,225,120";
      spawnBurst(f.x + FLAG_W / 2, f.y + FLAG_H / 2, 12,
                 [P_FLAG.R, P_FLAG.Y, P_FLAG.W], 130, 0.4);
      sfxFlag();
    }
  }

  // Two ways to finish: sweep every flag, or simply reach the end of the alley.
  // Requiring all ten would strand a player who missed one behind a one-way camera.
  if (flagsTaken >= flags.length || ninja.x >= GOAL_TILE * TILE) {
    // Settled once, on the frame the stage ends, so the figure on the summary
    // cannot drift while the ending screen sits there.
    timeBonus = Math.max(0, Math.floor(stagePar() - stageTotal)) * SCORE_TIME_STEP;
    score += timeBonus;
    mode = "clear"; flash = 0.45; flashCol = "255,240,160";
    recordRun();                    // after the bonus, or it banks the wrong total
  }

  ninja.animTime += dt;
  ninja.throwTimer = Math.max(0, ninja.throwTimer - dt);
  ninja.slashTimer = Math.max(0, ninja.slashTimer - dt);
  throwCd = Math.max(0, throwCd - dt);
  wakeT = Math.max(0, wakeT - dt);
  ninja.bump = Math.max(0, ninja.bump - dt);
  ninja.landTimer = Math.max(0, ninja.landTimer - dt);
  ninja.invuln = Math.max(0, ninja.invuln - dt);
  flash = Math.max(0, flash - dt);
}

/* --- RENDER --------------------------------------------------------------- */

function drawPixels(rows, sx, sy, flip, palette, cell) {
  const cols = rows[0].length;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < cols; c++) {
      const color = palette[row[c]];
      if (!color) continue;
      // Mirror by column index rather than ctx.scale: keeps cells integer-snapped.
      ctx.fillStyle = color;
      ctx.fillRect(sx + (flip ? cols - 1 - c : c) * cell, sy + r * cell, cell, cell);
    }
  }
}

/* A pose as one flat colour, drawn as horizontal RUNS instead of per pixel.
   drawPixels emits a fillRect per opaque cell because each cell can be a
   different colour; a silhouette cannot, so consecutive cells coalesce and a
   32x48 stamp costs about forty rects instead of eight hundred. That is what
   makes dash trails and impact frames cheap enough to leave on. */
function drawSilhouette(rows, sx, sy, flip, color, cell) {
  const cols = rows[0].length;
  ctx.fillStyle = color;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    let run = 0;
    for (let c = 0; c <= cols; c++) {
      if (c < cols && row[c] !== ".") { run++; continue; }
      if (!run) continue;
      const c0 = c - run;
      // Mirrored by column index, exactly as drawPixels does it, so a flipped
      // stamp lands on the same pixels as the flipped sprite.
      const px = flip ? sx + (cols - c) * cell : sx + c0 * cell;
      ctx.fillRect(px, sy + r * cell, run * cell, cell);
      run = 0;
    }
  }
}

function drawText(str, x, y, color, scale) {
  const sc = scale || 2;
  ctx.fillStyle = color;
  let cx = Math.round(x);
  const yy = Math.round(y);
  for (const ch of String(str).toUpperCase()) {
    const g = FONT[ch] || FONT[" "];
    for (let r = 0; r < FONT_H; r++) {
      for (let c = 0; c < FONT_W; c++) {
        if (g[r][c] === "#") ctx.fillRect(cx + c * sc, yy + r * sc, sc, sc);
      }
    }
    cx += (FONT_W + 1) * sc;
  }
}
/* `px` is the size of one glyph cell in DEVICE pixels. Coordinates are world
   units, as everywhere else. Positions are snapped to the device grid rather
   than the world grid -- snapping to whole world units would throw away the
   extra resolution this font exists to use. */
function drawTextHD(str, x, y, color, px) {
  const s = (px || 2) / RENDER_SCALE;
  ctx.fillStyle = color;
  let cx = Math.round(x * RENDER_SCALE) / RENDER_SCALE;
  const yy = Math.round(y * RENDER_SCALE) / RENDER_SCALE;
  for (const ch of String(str).toUpperCase()) {
    const g = FONT_HD[ch] || FONT_HD[" "];
    for (let r = 0; r < FONT_HD_H; r++) {
      let run = 0;
      for (let c = 0; c <= FONT_HD_W; c++) {
        if (c < FONT_HD_W && g[r][c] === "#") { run++; continue; }
        if (!run) continue;
        // Runs, not cells: a 5x7 glyph has about twice the set pixels of a 3x5
        // one, and the HUD draws a few hundred of them every frame.
        ctx.fillRect(cx + (c - run) * s, yy + r * s, run * s, s);
        run = 0;
      }
    }
    cx += (FONT_HD_W + 1) * s;
  }
}
function textWidthHD(str, px) {
  return String(str).length * (FONT_HD_W + 1) * ((px || 2) / RENDER_SCALE);
}

function textWidth(str, scale) {
  return String(str).length * (FONT_W + 1) * (scale || 2);
}

const WALK_CYCLE = ["walkA", "walkB", "walkC", "walkD"];

// Feed one frame's forward displacement in. `prog` is SIGNED against the
// direction the entity meant to go, so a body creeping a pixel into a wall and
// being snapped back out averages to nothing instead of to a twitch.
function trackWalk(e, prog, dt) {
  e.walkRate += (prog / dt - e.walkRate) * WALK_RATE_SMOOTH;
  // The phase only advances while genuinely walking, so a blocked body holds
  // its pose instead of slowly scrubbing through the cycle.
  if (isWalking(e)) e.walkDist += Math.max(0, prog);
}

function isWalking(e) { return e.walkRate > WALK_RATE_MIN; }

// contact -> pass -> contact -> pass. Keyed off distance travelled, which is
// accumulated from actual displacement: walking into a wall covers no ground
// and so does not animate a stride.
function strideOf(e) { return e.kind ? FOE_STRIDE_PX : STRIDE_PX; }

function walkFrame(e) {
  return WALK_CYCLE[Math.floor(e.walkDist / strideOf(e)) % WALK_CYCLE.length];
}

function poseNameOf(e) {
  if (e.crouch) return (e.throwTimer > 0 || e.slashTimer > 0) ? "crouchThrow" : "crouch";
  // The wind reads as its own pose: blade coming out of the scabbard, then the
  // cut. slashTimer counts DOWN, so the first SLASH_WIND seconds are the draw.
  if (e.slashTimer > 0) {
    return e.slashTimer > SLASH_TIME - SLASH_WIND ? "draw" : "slash";
  }
  if (e.throwTimer > 0) return "throw";
  if (!e.onGround) return "jump";
  if (e.landTimer > 0) return "land";
  if (isWalking(e)) return walkFrame(e);
  return (Math.floor(e.animTime * IDLE_FPS) % 2) ? "idleB" : "idle";
}

// Two-frame gait, offset per enemy by its animTime seed so a group does not
// march in lockstep. Previously enemies slid along with no footfall at all.
function enemyGait(e) {
  return isWalking(e) ? walkFrame(e) : "base";
}

// The LOCAL pose name; drawEntities() looks it up under the enemy's own kind.
function enemyPoseOf(e) {
  /* A sentry's poses come first: while `ledge` holds, the body is running the
     perch machine and its per-kind states are not valid to read. */
  if (e.ledge) {
    if (e.state === "perchWind" || e.state === "perchLand") return "coil";
    if (e.state === "dive") {
      // Whatever each kind already has that reads as "committed and airborne".
      return e.kind === "rusher" ? "leap" : e.kind === "charger" ? "lunge" : "sweep";
    }
    return "base";
  }
  if (e.kind === "rusher") {
    // The wall entrance has poses of its own: hands on the coping while it
    // watches, one leg across while it comes over. Guarded by a lookup rather
    // than assumed, so a kind without them -- or an asset pack that only
    // replaces some frames -- falls back to the standing pose instead of
    // handing drawPixels an undefined array.
    if (e.state === "peek" && ENEMY_POSES.rusher.wallGrab) return "wallGrab";
    /* The climb AND the drop, not just the climb. While it climbs, the coping
       still hides everything below the chest -- correctly, the leg is behind
       the wall -- so the swung leg this pose exists for is never actually seen.
       Keeping it through the fall is where it becomes visible, and a body
       dropping with one knee up is a better read there than a standing pose. */
    if ((e.state === "climb" || e.state === "vault") &&
        ENEMY_POSES.rusher.wallOver) return "wallOver";
    return e.state === "leap" ? "leap" : enemyGait(e);
  }
  if (e.kind === "charger") {
    if (e.state === "windup" || e.state === "swing") return "attack";
    if (e.state === "lungeWind" || e.state === "lunge") return "lunge";
    return enemyGait(e);
  }
  if (e.state === "sweepWind" || e.state === "sweep") return "sweep";
  if (e.state === "aim" || e.state === "burst") return "aim";
  if (e.state === "reload") return "duck";
  return enemyGait(e);
}

// One-way ratchet: the stage scrolls forward only. Ground you have passed is
// gone. The single exception is respawn, where a death resets the view.
function updateCamera() {
  const want = Math.max(0, Math.min(WORLD_W - VIEW_W,
                                    Math.round(ninja.x + BODY_W / 2 - VIEW_W / 2)));
  if (want > cam.x) cam.x = want;
}
function snapCamera() {
  cam.x = Math.max(0, Math.min(WORLD_W - VIEW_W,
                               Math.round(ninja.x + BODY_W / 2 - VIEW_W / 2)));
}

/* --- BACKGROUND: procedural parallax alley -------------------------------- */
/* Drawn with fillRect every frame rather than cached to an offscreen canvas,
   deliberately: the headless frame-dump tool reconstructs the image from
   recorded fillRect calls, so offscreen layers would be invisible to the only
   visual verification available here.

   Scroll rates are integer divisors of 640 and offsets are floored, because
   sub-pixel parallax is the main cause of shimmer under image-rendering:
   pixelated. The background is deliberately near-grey (low chroma) so the
   characters carry all the colour.                                          */

// Deterministic per-instance noise so repeated panels look identical each frame.
function rnd(seed) {
  const s = ((seed * 9301 + 49297) % 233280 + 233280) % 233280;
  return s / 233280;
}

// `id` is a stable WORLD index for each repeated panel: as the camera moves,
// `first` increments exactly as `off` wraps, so a given physical building keeps
// the same id. Every seed must be built from id, never from a screen x.
function layerLoop(rate, period, drawFn) {
  const off = Math.floor(cam.x * rate) % period;
  const first = Math.floor(cam.x * rate / period);
  for (let i = -1; i * period - off < VIEW_W + period; i++) {
    drawFn(i * period - off, first + i);
  }
}

/* NIGHT. This was an overcast daytime grey with a moon pasted on it, and the
   moon loses that argument. Three things make it night rather than "grey, but
   dimmer":

   - Every band sits below luminance 33. The bands are pinned there, not merely
     chosen dark: the ninja's gi is at 73 and the suite asserts a 40-point
     separation from every sky band, because he is the only body that jumps up
     into open sky. A dusk band anywhere in 33..113 is exactly where he
     disappears, which is why the horizon glow here is a deep warm brown
     rather than the orange it wants to be.
   - The far layers are now DARKER than the near wall instead of lighter.
     Daylight haze lightens distance; night swallows it. That inversion was
     most of why the old skyline read as an afternoon regardless of the moon.
   - The windows became the brightest thing in the frame, so the facades read
     as lit from within rather than lit from outside.                        */
const SKY_BANDS = [
  [0,   62,  "#0B1022"],    // zenith
  [62,  58,  "#101A33"],
  [120, 46,  "#15203A"],
  [166, 194, "#281A26"]     // the last of the light, low and warm
];
function drawSky() {
  for (let i = 0; i < SKY_BANDS.length; i++) {
    ctx.fillStyle = SKY_BANDS[i][2];
    ctx.fillRect(0, SKY_BANDS[i][0], VIEW_W, SKY_BANDS[i][1]);
  }
  drawStars();
  // Moon plus halo. The halo is three flat rings, not a gradient: a gradient is
  // the one thing that does not survive nearest-neighbour upscaling -- it bands,
  // and the bands crawl as the camera moves.
  ctx.fillStyle = "rgba(237,230,200,0.05)"; ctx.fillRect(506, 12, 46, 46);
  ctx.fillStyle = "rgba(237,230,200,0.08)"; ctx.fillRect(512, 18, 34, 34);
  ctx.fillStyle = "rgba(237,230,200,0.13)"; ctx.fillRect(517, 23, 24, 24);
  ctx.fillStyle = "#EDE6C8"; ctx.fillRect(520, 26, 18, 18);   // moon
  ctx.fillStyle = "#D8CFA8"; ctx.fillRect(524, 30, 10, 10);
  ctx.fillStyle = "#C6BC94"; ctx.fillRect(530, 33, 4, 4);     // one mare
}

// Stars, on the slowest parallax layer there is. Seeded from the WORLD panel
// index, never from a screen x -- seeded from the screen they would swim as the
// camera moved, which is the same bug the windows had.
function drawStars() {
  layerLoop(1 / 24, 320, (bx, id) => {
    for (let k = 0; k < 24; k++) {
      const q = rnd(id * 41 + k * 3);
      // A slow twinkle on about a third of them, phased off the star's own seed
      // so they do not all blink together.
      if (q > 0.66 && Math.floor(clock * 1.7 + q * 9) % 3 === 0) continue;
      const sx = bx + Math.floor(rnd(id * 31 + k * 7) * 320);
      const sy = 4 + Math.floor(rnd(id * 17 + k * 13) * 112);
      ctx.fillStyle = q > 0.88 ? "#FFFFFF" : (q > 0.5 ? "#C8D2E8" : "#8A94AE");
      ctx.fillRect(sx, sy, 1, 1);
      if (q > 0.945) {                    // the few brightest get a cross
        ctx.fillRect(sx - 1, sy, 3, 1);
        ctx.fillRect(sx, sy - 1, 1, 3);
      }
    }
  });
}

/* --- LIT WINDOWS ---------------------------------------------------------- */
/* The windows were the brightest thing in the frame and that was the right
   call; what they were not was a LIGHT. A bright rectangle on a dark facade is
   a sticker. A light spills.

   So every lit window now gets two concentric additive rings around it. The
   compositing is what does the work -- "lighter" adds to whatever is behind it,
   so the spill brightens the facade it sits on and fades into it, which no
   amount of picking a paler fill can imitate. Two rings, not a gradient:
   gradients band under nearest-neighbour upscaling and the bands crawl as the
   camera moves, which is the same reason the moon's halo is three flat rings.

   Windows also stopped being one colour. Three classes, seeded per window:
     WARM  domestic light, the bulk of them
     COOL  a television, and it FLICKERS fast and shallowly rather than
           switching, because that is what a screen looks like from outside
     DARK  unlit, near the facade colour so it reads as a window and not a hole
   And about one lit window in nine has someone standing in it -- a dark bar
